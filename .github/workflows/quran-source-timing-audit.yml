name: Sawti Quran source and timing audit
on:
  workflow_dispatch:
  push:
    branches: [feature/quran-full-recitation-cache-20261111]
    paths: [.github/workflows/quran-source-timing-audit.yml]
permissions:
  contents: write
concurrency:
  group: quran-source-timing-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/feature/quran-full-recitation-cache-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Probe Quran source audio and source-matched verse timing API
        run: python3 scripts/check_quran_continuous_sources.py
      - name: Save metadata for review on test branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/quran-full-playback-test/SOURCE-TIMING-AUDIT.json
          git diff --cached --quiet || (git commit -m "audit(quran): record actual source and timing availability" && git push origin HEAD:feature/quran-full-recitation-cache-20261111)
