name: Regenerate v1.6.1 audited neural clips

on:
  push:
    branches: [fix/audit-v161-199-confirmed-20261116]
    paths:
      - .github/workflows/v161-audit-regenerate-neural.yml

permissions:
  contents: write

concurrency:
  group: v161-audit-neural-regen
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-v161-199-confirmed-20261116
          fetch-depth: 1
          persist-credentials: true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install neural synthesizer
        run: python3 -m pip install --disable-pip-version-check 'edge-tts>=7,<9'
      - name: Export final speech and verify unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
          test -s app/build/speech_catalog.json
      - name: Regenerate changed speech only
        run: |
          python3 scripts/generate_neural_voices.py --dialects ALL --rate=-18% --concurrency 6 --attempts 4
          python3 scripts/validate_neural_packs.py
      - name: Commit and push changed neural assets only
        run: |
          test "$(git branch --show-current)" = "fix/audit-v161-199-confirmed-20261116"
          git add -u app/src/main/assets/neural_tts
          git diff --cached --quiet && { echo "No audio changes: unexpected if clips were stale."; exit 1; }
          git diff --cached --stat | tail -n 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c commit.gpgsign=false commit -m "audio: regenerate v1.6.1 audited neural clips and manifests"
          git push origin HEAD:refs/heads/fix/audit-v161-199-confirmed-20261116
