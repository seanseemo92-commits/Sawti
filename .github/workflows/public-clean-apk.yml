name: MyWords 4.2 signed release verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  clean-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Repair source archive locally without committing changes
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,os
          archive="MyWords.zip"
          tmp=archive+".tmp"
          with zipfile.ZipFile(archive) as src, zipfile.ZipFile(tmp,"w") as dst:
              for info in src.infolist():
                  data=src.read(info.filename)
                  if info.filename.endswith("/data/db/AppDatabase.kt"):
                      code=data.decode("utf-8")
                      for table in ("family_members","voice_recordings","pain_reports"):
                          code=code.replace('db.execSQL("DROP TABLE IF EXISTS '+table+'")','// Legacy table retained: '+table)
                      data=code.encode("utf-8")
                  dst.writestr(info,data)
          os.replace(tmp,archive)
          PY
          python3 -m unittest discover -s tests -v
      - name: Extract source and apply verified v77 fixes
        shell: bash
        run: |
          set -euo pipefail
          unzip -q MyWords.zip -d extracted
          test -f extracted/MyWords/settings.gradle.kts
          base64 -d ci/secure-backup-sources.tar.gz.b64 | tar -xz -C extracted/MyWords/app/src/main/java/com/mywords
          base64 --decode ci/mywords-backup-export-fix.patch.xz.b64 | xz --decompress | patch -p1 -d extracted/MyWords
          python3 ci/restore_success_ux.py
          base64 --decode ci/sawti-source-overlay.tar.gz.b64 | tar --extract --gzip --directory extracted
          sed -i 's/versionName = "3.2"/versionName = "4.0"/' extracted/MyWords/app/build.gradle.kts
          base64 --decode ci/sawti-family-feature.patch.xz.b64 | xz --decompress | patch --batch -p1 -d extracted/MyWords
          python3 ci/apply_sawti_family_migration.py
      - name: Permanently remove personal family examples from public APK sources
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/sanitize_public_family_ci.py
          test ! -e extracted/MyWords/app/src/main/java/com/mywords/data/db/LegacyFamilyDefaults.kt
          test -s extracted/MyWords/app/src/main/java/com/mywords/data/db/LegacyFamilyCleanup.kt
          grep -q 'version = 4,' extracted/MyWords/app/src/main/java/com/mywords/data/db/AppDatabase.kt
      - name: Harden release data protection and backups
        shell: bash
        run: python3 ci/prepare_secure_release.py
      - name: Install tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("extracted/MyWords/app/build.gradle.kts")
          s=p.read_text()
          if 'testImplementation("junit:junit:4.13.2")' not in s:
              s += '\n' if not s.endswith('\n') else ''
              s += '\ndependencies { testImplementation("junit:junit:4.13.2") }\n'
              p.write_text(s)
          PY
          mkdir -p extracted/MyWords/app/src/test/java/com/mywords/domain/model
          cp tests/android/PhonemicCueArabicTest.kt extracted/MyWords/app/src/test/java/com/mywords/domain/model/
      - name: Generate new signing identity for this one release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/MyWords/app/signing
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "MYWORDS_RELEASE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -storetype PKCS12 -keyalg RSA -keysize 3072 -validity 10000 \
            -alias mywords-release -dname "CN=MyWords, OU=Android Release, O=MyWords, C=LY" \
            -keystore extracted/MyWords/app/signing/mywords-publisher.p12 -storepass "$PASS" -keypass "$PASS"
          cat > extracted/MyWords/app/signing/KEEP_PRIVATE_SIGNING_INSTRUCTIONS.txt <<EOF
          MYWORDS 4.2 RELEASE SIGNING - PRIVATE KEY BACKUP
          DO NOT SHARE THIS KEY OR PASSWORD OR UPLOAD THEM TO PUBLIC GITHUB.
          Signing key: mywords-publisher.p12
          Store type: PKCS12
          Key alias: mywords-release
          Store and key password: $PASS
          You MUST preserve this exact signing key for future APK updates.
          The source project must use this key for all subsequent releases.
          EOF
          cat >> extracted/MyWords/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("publicRelease") {
                      storeFile = file("signing/mywords-publisher.p12")
                      storePassword = System.getenv("MYWORDS_RELEASE_PASSWORD")
                      keyAlias = "mywords-release"
                      keyPassword = System.getenv("MYWORDS_RELEASE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("publicRelease")
                  }
              }
          }
          EOF
      - name: Build signed release, check Android Lint and run unit tests
        working-directory: extracted/MyWords
        run: gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Verify APK cryptographic signatures
        shell: bash
        run: |
          set -euo pipefail
          apk=extracted/MyWords/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          grep -q 'android:allowBackup="false"' extracted/MyWords/app/src/main/AndroidManifest.xml
      - name: Package signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWords-v4-2-Signed-Release-APK
          path: extracted/MyWords/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Back up unique release signing identity (PRIVATE)
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-MyWords-Publisher-Key-BACKUP
          path: |
            extracted/MyWords/app/signing/mywords-publisher.p12
            extracted/MyWords/app/signing/KEEP_PRIVATE_SIGNING_INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 90
