name: Sawti Quran preview pre-release APK

on:
  push:
    branches:
      - fix/prelaunch-cleanup-hint
    paths:
      - .github/workflows/quran-preview-prerelease.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quran-preview-prerelease
  cancel-in-progress: false

jobs:
  quran-preview:
    if: github.ref == 'refs/heads/fix/prelaunch-cleanup-hint'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the exact dev-branch commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and validate unit tests and Android lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Prepare labeled APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/Sawti-Quran-Offline-Audio-debug.apk
          (
            cd release
            sha256sum Sawti-Quran-Offline-Audio-debug.apk > Sawti-Quran-Offline-Audio-debug.apk.sha256
          )

      - name: Publish GitHub pre-release without Actions Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "sawti-quran-offline-audio-preview-20261109" \
            release/Sawti-Quran-Offline-Audio-debug.apk \
            release/Sawti-Quran-Offline-Audio-debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "صوتي - معاينة القرآن بلا إنترنت (Debug)" \
            --notes "نسخة تجريبية من صوتي على فرع fix/prelaunch-cleanup-hint: عند تشغيل تلاوة آية أول مرة تحفظ كملف MP3 في مساحة التطبيق، وإعادة تشغيلها وتكرارها يعملان بدون إنترنت. أضفنا خيار تحميل تلاوة السورة كاملة مع متابعة التقدم. يحتفظ التطبيق بالنصوص القرآنية والسور والتصميم السابق. التلاوات من Islamic Network بصوت مشاري العفاسي؛ أول تحميل يحتاج إنترنت. هذا APK بتوقيع Debug وليس تحديثاً مباشراً للإصدار الرسمي الموقع 1.0؛ لا تحذف النسخة الحالية دون نسخة احتياطية."
