name: Sawti Quran preview pre-release APK

on:
  push:
    branches:
      - fix/prelaunch-cleanup-hint
    paths:
      - .github/workflows/quran-preview-prerelease.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quran-preview-prerelease
  cancel-in-progress: false

jobs:
  quran-preview:
    if: github.ref == 'refs/heads/fix/prelaunch-cleanup-hint'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the exact dev-branch commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and validate unit tests and Android lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Prepare labeled APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/Sawti-Quran-Sudais-Preview-debug.apk
          (
            cd release
            sha256sum Sawti-Quran-Sudais-Preview-debug.apk > Sawti-Quran-Sudais-Preview-debug.apk.sha256
          )

      - name: Publish GitHub pre-release without Actions Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "sawti-quran-sudais-selector-preview-20261109" \
            release/Sawti-Quran-Sudais-Preview-debug.apk \
            release/Sawti-Quran-Sudais-Preview-debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "صوتي - معاينة السديس واختيار القارئ (Debug)" \
            --notes "معاينة على فرع fix/prelaunch-cleanup-hint: اختيار القارئ بين مشاري العفاسي وعبدالرحمن السديس من قائمة بسيطة في صفحة الآيات، مع حفظ الاختيار وتسجيلات كل قارئ في مجلد منفصل، وتشغيل الآيات المحمّلة دون إنترنت. يحتفظ التطبيق بقسم القرآن والتصميم السابق. أول تنزيل لصوت القارئ يحتاج الإنترنت. نسخة Debug للتجربة فقط، ليست تحديثاً مباشراً للإصدار الرسمي 1.0؛ لا تحذف النسخة الحالية دون نسخة احتياطية."
