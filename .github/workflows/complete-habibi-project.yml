name: Complete Habibi audio and build test APK

on:
  workflow_dispatch:
    inputs:
      libyan_listening_passed:
        description: 'The Libyan pilot passed native listening with the configured Libyan reference'
        type: boolean
        required: true
        default: false
      recover_run_id:
        description: 'Earlier compatible run whose verified clips should be reused'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: sawti-complete-habibi-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARD_COUNT: '6'
  RECOVER_RUN_ID: ${{ inputs.recover_run_id }}
  HF_HUB_DISABLE_XET: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/migration/habibi-tts-20261116' && inputs.libyan_listening_passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      catalog_sha: ${{ steps.catalog.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm the Libyan reference is available before scheduling workers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = Path('scripts/ref_voices/ref_config.json')
          ref = json.loads(cfg.read_text())['dialects']['LIBYAN']
          if not ref['ref_audio'] or not ref['ref_text'] or not (cfg.parent / ref['ref_audio']).is_file():
              raise SystemExit('The Libyan batch requires a configured native reference.')
          PY
      - name: Install codec tools for real audio tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate source, database and the complete real corpus
        run: |
          python scripts/verify_repository_baseline.py
          python scripts/verify_release.py
          chmod +x gradlew
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest
          git diff --exit-code -- app/schemas
          python -m pip install numpy soundfile pydub
          python -m unittest discover -s scripts -p 'test_habibi*.py'
      - name: Save exact exported catalog for every worker
        id: catalog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CONTROL="habibi-checkpoints/$GITHUB_RUN_ID/catalog"
          if git ls-remote --exit-code origin "refs/heads/$CONTROL" >/dev/null 2>&1; then
            git fetch origin "$CONTROL"
            SHA=$(git rev-parse FETCH_HEAD)
            git show "$SHA:app/build/speech_catalog.json" > "$RUNNER_TEMP/prior-catalog.json"
            cmp app/build/speech_catalog.json "$RUNNER_TEMP/prior-catalog.json"
          else
            git add -f app/build/speech_catalog.json
            git commit -m 'build(habibi): pin exact Kotlin-exported corpus for parallel generation'
            git push origin "HEAD:refs/heads/$CONTROL"
            SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  generate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        dialect: [STANDARD, LIBYAN, SAUDI, EGYPTIAN, SYRIAN, IRAQI, TUNISIAN, MOROCCAN, ALGERIAN]
        shard: [0, 1, 2, 3, 4, 5]
    env:
      DIALECT: ${{ matrix.dialect }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.catalog_sha }}
          fetch-depth: 0
      - name: Resume the same worker checkpoint after reruns
        run: |
          set -euo pipefail
          CHECKPOINT="habibi-checkpoints/$GITHUB_RUN_ID/${DIALECT,,}-$SHARD"
          if git ls-remote --exit-code origin "refs/heads/$CHECKPOINT" >/dev/null 2>&1; then
            git fetch origin "$CHECKPOINT"
            git checkout --detach FETCH_HEAD
          elif [[ "$RECOVER_RUN_ID" =~ ^[0-9]+$ ]] && [ "$RECOVER_RUN_ID" != "$GITHUB_RUN_ID" ]; then
            PRIOR="habibi-checkpoints/$RECOVER_RUN_ID/${DIALECT,,}-$SHARD"
            if git ls-remote --exit-code origin "refs/heads/$PRIOR" >/dev/null 2>&1; then
              git fetch origin "$PRIOR"
              # Import only verified audio state, retaining the repaired source.
              git checkout FETCH_HEAD -- "app/src/main/assets/neural_tts/${DIALECT,,}"
            fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-habibi.txt
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: habibi-unified-cpu-${{ runner.os }}-${{ hashFiles('scripts/requirements-habibi.txt') }}
      - name: Install CPU inference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-habibi.txt
          python -m pip check
      - name: Generate all assigned real clips
        id: synthesis
        timeout-minutes: 305
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -u scripts/generate_habibi_tts.py --dialect "$DIALECT" --device cpu \
            --shard-count "$SHARD_COUNT" --shard-index "$SHARD" --skip-existing \
            --checkpoint-run-id "$GITHUB_RUN_ID" --checkpoint-every 8 --max-seconds 17400
      - name: Persist every verified completed clip, including after inference errors
        if: ${{ always() && steps.synthesis.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/habibi_ci.py save --dialect "$DIALECT" \
            --shard-count "$SHARD_COUNT" --shard-index "$SHARD" --run-id "$GITHUB_RUN_ID"

  assemble-and-build:
    needs: [prepare, generate]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install codec tools for full-pack verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Recover exact validated catalog and assemble all 54 checkpoints
        run: |
          set -euo pipefail
          mkdir -p app/build
          git fetch origin "habibi-checkpoints/$GITHUB_RUN_ID/catalog"
          git show FETCH_HEAD:app/build/speech_catalog.json > app/build/speech_catalog.json
          python scripts/habibi_ci.py assemble --run-id "$GITHUB_RUN_ID" --shard-count "$SHARD_COUNT"
      - name: Save the complete validated audio corpus to the migration branch
        id: audio
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/neural_tts/
          if ! git diff --cached --quiet; then
            git commit -m 'feat(habibi): bundle all 2399 verified nine-dialect voice clips'
          fi
          # Normal push refuses to overwrite intervening user changes.
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate complete source and create installable isolated test APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest
          python scripts/verify_habibi_packs.py --verify-codec
          git diff --exit-code -- app/schemas
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process -PhabibiPreview=true \
            :app:assembleDebug :app:assembleRelease :app:lintRelease
          test "$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Ec '^assets/neural_tts/.+[.]mp3$')" = 2399
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sawti-Habibi-Full-Test.apk
          sha256sum dist/Sawti-Habibi-Full-Test.apk > dist/Sawti-Habibi-Full-Test.apk.sha256
      - name: Upload test APK and verification reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-Habibi-Full-Test-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/*.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this run's temporary checkpoints after complete delivery
        if: success()
        run: |
          git ls-remote --heads origin "refs/heads/habibi-checkpoints/$GITHUB_RUN_ID/*" \
            | awk '{print ":" $2}' | xargs -r -n 20 git push origin
