name: Crop splash images once on step-three branch
on:
  push:
    branches:
      - fix/splash-crop-waves-step3
jobs:
  crop:
    if: "github.event.head_commit.message == 'chore(splash): run approved 58-percent image crop'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Crop only the three images as requested
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import os

          paths = [
              "app/src/main/res/drawable/ic_splash_logo_light.png",
              "app/src/main/res/drawable/ic_splash_logo_dark.png",
              "app/src/main/res/drawable-night/ic_splash_logo.png"
          ]

          for p in paths:
              if os.path.exists(p):
                  img = Image.open(p).convert("RGBA")
                  w, h = img.size
                  # الاحتفاظ بأول 58% من الارتفاع (الرمز العلوي فقط) وحذف النص السفلي المقطوع
                  cropped = img.crop((0, 0, w, int(h * 0.58)))
                  cropped.save(p)
                  print(f"Successfully cropped: {p}")
          PY
      - name: Commit and push cropped images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/ic_splash_logo_light.png app/src/main/res/drawable/ic_splash_logo_dark.png app/src/main/res/drawable-night/ic_splash_logo.png
          git diff --cached --quiet && { echo "No image changes"; exit 1; }
          git commit -m "fix(splash): crop original logo files to their top 58 percent"
          git push origin HEAD:fix/splash-crop-waves-step3
