name: Build Libyan Habibi preview
on:
  push:
    branches: [preview/habibi-libyan-20261118]
    paths: [.github/workflows/habibi-libyan-preview.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARDS: '40'
  HF_HUB_DISABLE_XET: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Export the exact catalog and validate Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest
          git diff --exit-code -- app/schemas
      - uses: actions/upload-artifact@v4
        with:
          name: libyan-preview-catalog
          path: app/build/speech_catalog.json
          if-no-files-found: error
      - name: Set the shard matrix
        id: matrix
        run: python3 -c 'import json,os; print("shards=" + json.dumps(list(range(int(os.environ["SHARDS"])))))' >> "$GITHUB_OUTPUT"

  synthesize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libyan-preview-catalog
          path: build/preview-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-habibi.txt
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: habibi-unified-cpu-${{ runner.os }}-${{ hashFiles('scripts/requirements-habibi.txt') }}
      - name: Install inference and encoding dependencies
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-habibi.txt
      - name: Generate this preview shard
        run: |
          python -u scripts/generate_habibi_tts.py --dialect LIBYAN --libyan-preview \
            --catalog build/preview-catalog/speech_catalog.json --output build/preview-shard \
            --shard-count "$SHARDS" --shard-index "$SHARD" --skip-existing
      - uses: actions/upload-artifact@v4
        with:
          name: libyan-shard-${{ matrix.shard }}
          path: build/preview-shard/
          if-no-files-found: error

  build:
    needs: synthesize
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: libyan-shard-*
          path: build/preview-shards
      - uses: actions/download-artifact@v4
        with:
          name: libyan-preview-catalog
          path: build/preview-catalog
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify all 271 clips and overlay the Libyan assets in this build
        run: |
          command -v ffprobe || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          python3 scripts/assemble_libyan_preview.py \
            --catalog build/preview-catalog/speech_catalog.json --shards build/preview-shards \
            --output build/verified-preview --count "$SHARDS"
          cp -a build/verified-preview/libyan/. app/src/main/assets/neural_tts/libyan/
      - name: Build the isolated preview and verify APK contents
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process -PlibyanPreview=true \
            :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sawti-Habibi-Libyan-Preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/libyan-tests.apk
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile
          folder = Path('build/verified-preview/libyan')
          manifest = json.loads((folder / 'manifest.json').read_text())
          assert len(manifest['entries']) == 271
          prefix = 'assets/neural_tts/libyan/'
          with ZipFile('dist/Sawti-Habibi-Libyan-Preview.apk') as apk:
              assert apk.read(prefix + 'manifest.json') == (folder / 'manifest.json').read_bytes()
              expected = {prefix + row['file'] for row in manifest['entries'].values()}
              assert {name for name in apk.namelist() if name.startswith(prefix) and name.endswith('.mp3')} == expected
              for row in manifest['entries'].values():
                  assert hashlib.sha256(apk.read(prefix + row['file'])).hexdigest() == row['sha256']
          PY
          (cd dist && sha256sum Sawti-Habibi-Libyan-Preview.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: libyan-preview-build
          path: dist/
          if-no-files-found: error

  launch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libyan-preview-build
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open on Android 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install dist/Sawti-Habibi-Libyan-Preview.apk
            adb install dist/libyan-tests.apk
            adb shell am instrument -w -r -e class com.sawti.HabibiStartupTest com.sawti.libyanpreview.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.txt
            cat instrumentation.txt
            grep -q '^OK (' instrumentation.txt
            adb shell am start -W -n com.sawti.libyanpreview/com.sawti.MainActivity
            sleep 4
            adb shell pidof com.sawti.libyanpreview
      - uses: actions/upload-artifact@v4
        with:
          name: Sawti-Habibi-Libyan-Preview
          path: |
            dist/Sawti-Habibi-Libyan-Preview.apk
            dist/SHA256SUMS.txt
            instrumentation.txt
          if-no-files-found: error
