name: Reproduce original Habibi preview crash
on:
  push:
    branches: [migration/habibi-tts-20261116]
    paths: [.github/workflows/habibi-startup-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact preview reported to crash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44035200934 --name Sawti-Habibi-Full-Test-44035200934 --dir dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the shipped APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p diagnostics
            adb install "$(find dist -name Sawti-Habibi-Full-Test.apk -print -quit)"
            adb logcat -c
            adb shell am start -W -n com.sawti.habibipreview/com.sawti.MainActivity > diagnostics/launch.txt
            sleep 20
            adb logcat -d > diagnostics/logcat.txt
            adb shell dumpsys activity activities > diagnostics/activities.txt
            adb exec-out screencap -p > diagnostics/screen.png
            cat diagnostics/launch.txt
            sed -n '/FATAL EXCEPTION/,+65p' diagnostics/logcat.txt
            adb shell pidof com.sawti.habibipreview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-api-${{ matrix.api }}-${{ github.run_id }}
          path: diagnostics/
