name: Test Libyan cow pronunciation - Shakir bright (non-production)
on:
  push:
    branches: [fix/libyan-g-pronunciation-20261116]
    paths:
      - 'scripts/libyan_cow_pronunciation_trials.py'
      - '.github/workflows/libyan-cow-pronunciation-trials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cow-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install edge TTS
        run: python -m pip install 'edge-tts>=6.1,<9'
      - name: Generate nine phoneme comparisons for same voice
        run: python scripts/libyan_cow_pronunciation_trials.py
      - name: Verify recordings and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          p=Path('build/libyan-cow-pronunciation-trials')
          mp3=list(p.glob('*.mp3'))
          assert len(mp3)==9, len(mp3)
          assert all(x.stat().st_size>1024 for x in mp3)
          with (p/'INDEX.csv').open(encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==9
          assert all(r['voice']=='ar-EG-ShakirNeural' and r['rate']=='-8%' and r['pitch']=='+12Hz' for r in rows)
          print('9 usable candidates - actual pronunciation still needs native listener')
          PY
      - name: Upload ZIP for listening
        uses: actions/upload-artifact@v4
        with:
          name: sawti-shakir-cow-nine-pronunciation-trials
          path: build/libyan-cow-pronunciation-trials/
          retention-days: 14
          if-no-files-found: error
