name: Generate Habibi-TTS voice packs

on:
  workflow_dispatch:
    inputs:
      dialect:
        description: Generate ALL or one Sawti dialect
        required: true
        default: LIBYAN
        type: choice
        options: [ALL, LIBYAN, TUNISIAN, ALGERIAN, MOROCCAN, EGYPTIAN, SYRIAN, IRAQI, SAUDI, STANDARD]
      max_new:
        description: 'Maximum new clips per dialect this run; 0 = all (time budget still applies)'
        required: true
        type: number
        default: 16
      libyan_listening_passed:
        description: The Libyan pilot passed listening with the configured Libyan reference
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sawti-habibi-voice-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.ref_type == 'branch' && ((inputs.dialect != 'LIBYAN' && inputs.dialect != 'ALL') || inputs.libyan_listening_passed) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-habibi.txt
      - name: Cache downloaded model and vocoder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/cached_path
          key: habibi-unified-v1-${{ runner.os }}-${{ hashFiles('scripts/requirements-habibi.txt') }}
      - name: Install CPU inference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-habibi.txt
          python -m pip check
      - name: Export and test the exact clean Kotlin speech corpus
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.sawti.domain.model.ExportSpeechCatalogTest' --tests 'com.sawti.domain.model.HabibiSpeechTextTest'
          python -m unittest discover -s scripts -p 'test_habibi*.py'
      - name: Synthesize a staged CPU batch
        id: synthesize
        timeout-minutes: 305
        env:
          DIALECT: ${{ inputs.dialect }}
          MAX_NEW: ${{ inputs.max_new }}
        run: |
          python scripts/generate_habibi_tts.py --dialect "$DIALECT" --device cpu \
            --output build/habibi-batch --max-new "$MAX_NEW" --max-seconds 17400
      - name: Validate completed clips without replacing app assets
        id: verify_batch
        if: ${{ always() && steps.synthesize.outcome != 'skipped' }}
        env:
          DIALECT: ${{ inputs.dialect }}
        run: |
          if [ ! -d build/habibi-batch ]; then exit 0; fi
          python scripts/verify_habibi_packs.py --root build/habibi-batch \
            --dialect "$DIALECT" --allow-partial --verify-codec
          git diff --exit-code -- app/src/main/assets/neural_tts
      - name: Preserve outputs for review
        if: ${{ always() && steps.verify_batch.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: habibi-${{ inputs.dialect }}-${{ github.run_id }}
          path: build/habibi-batch/
          if-no-files-found: warn
          retention-days: 7
