name: Generate regional neural voices
on:
  push:
    branches: [main, fix/sawti-v161-neural-lexicon-20261115, fix/audit-v161-199-confirmed-20261116, fix/libyan-g-pronunciation-20261116]
    paths:
      - 'app/src/main/java/com/sawti/domain/model/NeuralSpeechNormalizer.kt'
      - 'app/src/main/java/com/sawti/domain/model/DialectSpeechCatalog.kt'
      - 'app/src/main/java/com/sawti/domain/model/DialectCatalog.kt'
      - 'app/src/main/java/com/sawti/domain/model/DialectSpeechRevisions.kt'
      - 'app/src/main/java/com/sawti/domain/model/NeuralLexicon161.kt'
      - 'app/src/main/java/com/sawti/domain/model/NeuralLexicon162.kt'
      - 'scripts/neural_v162_overrides.csv'
      - 'app/src/main/java/com/sawti/domain/model/GreetingsCatalog.kt'
      - 'app/src/main/java/com/sawti/domain/model/TransportCatalog.kt'
      - 'app/src/main/java/com/sawti/data/db/WordSeed.kt'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/sawti/domain/model/RegionalDishesCatalog.kt'
      - 'scripts/generate_neural_voices.py'
      - 'scripts/validate_neural_packs.py'
      - 'scripts/libyan_shakir_approved_samples.csv'
      - '.github/workflows/generate-neural-voices.yml'
  workflow_dispatch:
    inputs:
      dialects:
        description: 'LIBYAN, ALL, or a comma-separated list of dialects'
        required: true
        default: ALL
        type: string
      voice_gender:
        description: 'Voice gender for selected dialects'
        required: true
        default: female
        type: choice
        options: [female, male]
      commit_to_branch:
        description: 'Commit audio packs to the selected branch'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: neural-voice-pack-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export exact Kotlin catalog speech forms
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.sawti.domain.model.ExportSpeechCatalogTest'
          test -s app/build/speech_catalog.json
      - name: Validate exact v1.6.2 source/export parity
        if: ${{ github.ref == 'refs/heads/fix/audit-v161-199-confirmed-20261116' || github.ref == 'refs/heads/fix/libyan-g-pronunciation-20261116' }}
        run: python scripts/verify_neural_v162_catalog.py
      - name: Install Edge TTS
        run: python -m pip install 'edge-tts>=6.1,<9'
      - name: Generate selected dialect pack
        env:
          DIALECTS: ${{ inputs.dialects || (github.ref == 'refs/heads/fix/libyan-g-pronunciation-20261116' && 'LIBYAN' || 'ALL') }}
          GENDER: ${{ inputs.voice_gender || 'female' }}
        run: |
          python scripts/generate_neural_voices.py --dialects "$DIALECTS" --gender "$GENDER" --rate=-18% --concurrency 2 --attempts 10
          python scripts/validate_neural_packs.py
      - name: Upload voice pack
        uses: actions/upload-artifact@v4
        with:
          name: sawti-neural-voices-${{ github.run_id }}
          path: app/src/main/assets/neural_tts/
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated audio to this branch
        if: ${{ (github.event_name == 'push' || inputs.commit_to_branch) && github.ref_type == 'branch' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/neural_tts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(audio): regenerate only changed neural voice clips'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Re-run full PR validation after committing regenerated assets
        if: ${{ github.ref == 'refs/heads/fix/audit-v161-199-confirmed-20261116' || github.ref == 'refs/heads/fix/libyan-g-pronunciation-20261116' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${GITHUB_REF_NAME}" --field full_build=true
