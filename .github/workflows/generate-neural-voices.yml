name: Generate regional neural voices
on:
  workflow_dispatch:
    inputs:
      dialects:
        description: 'LIBYAN, ALL, or a comma-separated list of dialects'
        required: true
        default: LIBYAN
        type: string
      voice_gender:
        description: 'Voice gender for selected dialects'
        required: true
        default: female
        type: choice
        options: [female, male]
      commit_to_branch:
        description: 'Commit audio packs to the selected branch'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: neural-voice-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export exact Kotlin catalog speech forms
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.sawti.domain.model.ExportSpeechCatalogTest'
          test -s app/build/speech_catalog.json
      - name: Install Edge TTS
        run: python -m pip install 'edge-tts>=6.1,<9'
      - name: Generate selected dialect pack
        env:
          DIALECTS: ${{ inputs.dialects }}
          GENDER: ${{ inputs.voice_gender }}
        run: |
          python scripts/generate_neural_voices.py --dialects "$DIALECTS" --gender "$GENDER"
      - name: Upload voice pack
        uses: actions/upload-artifact@v4
        with:
          name: sawti-neural-voices-${{ github.run_id }}
          path: app/src/main/assets/neural_tts/
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated audio to this branch
        if: ${{ inputs.commit_to_branch && github.ref_type == 'branch' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/neural_tts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(audio): generate selected regional neural voice pack'
          git push origin HEAD:"${GITHUB_REF_NAME}"
