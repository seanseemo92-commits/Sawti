name: Retry and release validation

# Full validation is explicit; avoid duplicate push + PR runs.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant wrapper permission
        run: chmod +x gradlew
      - name: Validate release metadata
        run: python3 scripts/verify_release.py
      - name: Run full validation in one Gradle invocation
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --continue --stacktrace
      - name: Upload validation reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-full-validation-reports
          if-no-files-found: warn
          retention-days: 3
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/
