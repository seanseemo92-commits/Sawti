name: Retry and release validation

on:
  push:
    branches: ['fix/prelaunch-cleanup-hint']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [testDebugUnitTest, lintDebug, assembleDebug, assembleRelease]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant wrapper permission
        run: chmod +x gradlew
      - name: Validate
        run: ./gradlew :app:${{ matrix.task }} --stacktrace
      - name: Upload reports and build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.task }}
          if-no-files-found: warn
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
            app/build/outputs/mapping/
