name: Generate Sawti legacy launcher icons
on:
  push:
    branches:
      - feat/conversation-adaptive-launcher-icon-20261029
permissions:
  contents: write
jobs:
  generate-icon-assets:
    if: "github.event.head_commit.message == 'chore(icon): generate conversation light and dark legacy bitmaps'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native vector rasterization dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy cairosvg
      - name: Generate all density and theme variants from the checked-in vectors
        run: python tools/generate_launcher_icons.py
      - name: Assert no old glyph in launcher resources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable/sawti_adaptive_brand.xml
          test -s app/src/main/res/drawable-night/sawti_adaptive_brand.xml
          if grep -iEq '(letter sad|letter ص|letterform|ص \\+ waveform)' \
                app/src/main/res/drawable/ic_launcher_foreground.xml \
                app/src/main/res/drawable/ic_launcher_monochrome.xml; then
            echo "::error::Obsolete launcher branding reference"
            exit 1
          fi
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for kind in ic_launcher ic_launcher_round; do
              test -s "app/src/main/res/mipmap-${dpi}/${kind}.png"
              test -s "app/src/main/res/mipmap-${dpi}/${kind}_night.png"
              test -s "app/src/main/res/mipmap-night-${dpi}/${kind}.png"
            done
          done
      - name: Upload high resolution day/night icon preview
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-conversation-launcher-preview
          path: sawti_icon_comparison.png
          if-no-files-found: error
      - name: Commit regenerated PNGs without overwriting other branch work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/mipmap-*/ic_launcher*.png
          git diff --cached --quiet && { echo "::error::Expected icon changes"; exit 1; }
          git commit -m "feat(icon): regenerate all legacy conversation launcher bitmaps"
          git fetch origin feat/conversation-adaptive-launcher-icon-20261029
          git rebase FETCH_HEAD
          git push origin HEAD:feat/conversation-adaptive-launcher-icon-20261029
