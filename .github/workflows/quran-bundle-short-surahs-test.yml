name: Sawti 1.4 — bundle Quran short surahs and build offline Debug APK

on:
  push:
    branches: [feat/quran-offline-short-surahs-20261111]
    paths:
      - .github/workflows/quran-bundle-short-surahs-test.yml
      - scripts/prepare_quran_surahs.py
      - scripts/verify_quran_surahs.py
      - app/src/main/java/com/sawti/presentation/quran/**
      - app/src/test/java/com/sawti/presentation/quran/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quran-offline-short-surahs-bundle
  cancel-in-progress: false

jobs:
  offline-quran:
    if: github.ref == 'refs/heads/feat/quran-offline-short-surahs-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout isolated Quran test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Prepare tools for exact MP3 and Quran text checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg > /dev/null
          python3 --version

      - name: Download original full-ayah files for 13 short surahs and all three readers
        run: |
          set -euo pipefail
          python3 scripts/prepare_quran_surahs.py

      - name: Check all 201 original MP3 recordings, hashes and 13 Uthmani texts
        run: |
          set -euo pipefail
          python3 scripts/verify_quran_surahs.py --decode

      - name: Save verified bundled sources to the feature branch, never main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/quran_surahs/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(quran): package 13 short surahs for three original reciters [offline-test]'
            git push origin HEAD:feat/quran-offline-short-surahs-20261111
          fi

      - name: Set up Java and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run all tests and Lint, assemble isolated Debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PquranPreview=true :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue
          git diff --exit-code -- app/schemas

      - name: Confirm exact offline assets inside APK, not in a post-install download
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/sawti_apk_contents.txt
          AUDIO_COUNT=$(grep -Ec '^assets/quran_surahs/(ar.alafasy|salah.bukhatir|husary.muallim)/[0-9]{6}\.mp3$' /tmp/sawti_apk_contents.txt)
          TEXT_COUNT=$(grep -Ec '^assets/quran_surahs/text/surah_[0-9]+\.json$' /tmp/sawti_apk_contents.txt)
          test "$AUDIO_COUNT" = 201
          test "$TEXT_COUNT" = 13
          grep -q '^assets/quran_surahs/catalog.json$' /tmp/sawti_apk_contents.txt
          grep -q '^assets/quran_passages/catalog.json$' /tmp/sawti_apk_contents.txt
          mkdir -p dist
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" > dist/TEST-APK-METADATA.txt
          grep -q "package: name='com.sawti.quranpreview'" dist/TEST-APK-METADATA.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > dist/TEST-APK-SIGNATURE.txt
          cp "$APK" dist/Sawti-Quran-v1.4-Fully-Offline-test.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf 'Bundled Quran audio MP3 files: %s\nBundled Uthmani surah texts: %s\nQuran passages (78 old files) remain included.\n' "$AUDIO_COUNT" "$TEXT_COUNT" > dist/OFFLINE-ASSETS-REPORT.txt

      - name: Upload verified test APK and report
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-Quran-v1.4-Fully-Offline-Debug
          path: |
            dist/*
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 7

      - name: Provide direct APK on feature branch if artifact storage is full
        if: steps.artifact.outcome != 'success'
        run: |
          set -euo pipefail
          mkdir -p previews/quran-offline-short-surahs
          cp dist/* previews/quran-offline-short-surahs/
          git add previews/quran-offline-short-surahs/
          git diff --cached --quiet || git commit -m 'build(quran): deliver isolated fully-offline Debug test APK'
          git push origin HEAD:feat/quran-offline-short-surahs-20261111
