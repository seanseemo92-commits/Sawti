name: Sawti Android build and validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Sawti source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate cleaned public-source baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test ! -f app/src/main/java/com/sawti/data/db/LegacyFamilyCleanup.kt
          test ! -f app/src/main/java/com/sawti/data/db/LegacyFamilyDefaults.kt
          test -f README.md
          grep -q 'versionName = "4.6.0"' app/build.gradle.kts
          grep -q 'rootProject.name = "Sawti"' settings.gradle.kts
          grep -q '<string name="app_name">صوتي</string>' app/src/main/res/values/strings.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          # Prevent accidental resurrection of stale splash screens/resources.
          test -f app/src/main/java/com/sawti/presentation/splash/SawtiAuroraSplash.kt
          grep -q 'SawtiAuroraSplash(' app/src/main/java/com/sawti/MainActivity.kt
          # Approved images for both app-selected light and dark appearance.
          test -s app/src/main/res/drawable-nodpi/sawti_welcome_light.webp
          test -s app/src/main/res/drawable-nodpi/sawti_welcome_dark.webp
          test ! -f app/src/main/res/drawable-nodpi/sawti_approved_reference.webp
          grep -q 'LocalIsDark.current' app/src/main/java/com/sawti/presentation/splash/SawtiAuroraSplash.kt
          grep -q 'sawti_welcome_light' app/src/main/java/com/sawti/presentation/splash/SawtiAuroraSplash.kt
          grep -q 'sawti_welcome_dark' app/src/main/java/com/sawti/presentation/splash/SawtiAuroraSplash.kt
          test -f app/src/main/res/drawable/ic_launcher_foreground.xml
          # Native launcher + Android 12 system splash must use the NEW
          # communication-symbol vectors (day/night), never the old ص art.
          test -s app/src/main/res/drawable/sawti_adaptive_brand.xml
          test -s app/src/main/res/drawable-night/sawti_adaptive_brand.xml
          grep -q 'sawti_adaptive_brand' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'sawti_adaptive_brand' app/src/main/res/values-v31/themes.xml
          grep -q 'sawti_adaptive_brand' app/src/main/res/values-night-v31/themes.xml
          test ! -f app/src/main/res/drawable-nodpi/sawti_adaptive_brand.png
          test ! -f app/src/main/res/drawable-night-nodpi/sawti_adaptive_brand.png
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for kind in ic_launcher ic_launcher_round; do
              test -s "app/src/main/res/mipmap-${dpi}/${kind}.png"
              test -s "app/src/main/res/mipmap-${dpi}/${kind}_night.png"
              test -s "app/src/main/res/mipmap-night-${dpi}/${kind}.png"
            done
          done
          test -f app/src/main/res/drawable/sawti_aurora_window.xml
          test -f app/src/main/res/drawable-night/sawti_aurora_window.xml
          test ! -f app/src/main/java/com/sawti/presentation/splash/SawtiSplashScreen.kt
          test ! -f app/src/main/java/com/sawti/presentation/splash/SawtiWelcomeScreen.kt
          test ! -f app/src/main/res/drawable/bg_splash_waves.png
          test ! -f app/src/main/res/drawable-night/bg_splash_waves.png
          test ! -f app/src/main/res/drawable/sawti_wordmark_vector_light.xml
          test ! -f app/src/main/res/drawable/sawti_wordmark_vector_dark.xml
          if find . -path './.git' -prune -o \( -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' \) -print | grep -q .; then
            echo "::error::Signing key found in source; aborting"
            exit 1
          fi
      - name: Compile debug and R8 release, unit tests and Android lint
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Check exported foundation schema
        run: |
          test -s app/schemas/com.sawti.data.db.AppDatabase/1.json
          git diff --exit-code -- app/schemas
      - name: Summarize pending speech reviews
        run: |
          python3 - <<'PYREPORT'
          import csv
          from collections import Counter
          with open('app/build/reports/speech-review.tsv', encoding='utf-8') as report:
              rows = list(csv.DictReader(report, delimiter='\t'))
          print(f'Speech review rows: {len(rows)}')
          for dialect in sorted({row['dialect'] for row in rows}):
              counts = Counter(row['source'] for row in rows if row['dialect'] == dialect)
              print(dialect, dict(counts))
          print('Native-speaker review and device TTS listening: PENDING for every row.')
          PYREPORT
      - name: Upload validation and speech review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-validation-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/reports/speech-review.tsv
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-v4.6.0-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned R8 Release APK for validation only
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-v4.6.0-unsigned-release-ci
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

