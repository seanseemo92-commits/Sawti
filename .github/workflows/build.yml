name: Sawti Android build and validation
on:
  push:
    branches: [main, feature/quran-full-recitation-cache-20261111]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Also build debug/release APKs and run Android lint'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    # The delivery workflow runs the complete checks and signs the same commit.
    if: >-
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/feature/quran-full-recitation-cache-20261111' &&
        contains(github.event.head_commit.message, '[deliver-rc]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Fast path (PRs): validation + unit tests + schema check only.
      # Full path (push to main, or manual dispatch with full_build): also APKs and lint.
      FULL_BUILD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_build) }}
    steps:
      - name: Checkout Sawti source
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release metadata
        run: python3 scripts/verify_release.py
      - name: Validate current repository baseline
        run: python3 scripts/verify_repository_baseline.py
      - name: Compile and run unit tests (fast path)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Check exported foundation schema
        run: |
          test -s app/schemas/com.sawti.data.db.AppDatabase/1.json
          git diff --exit-code -- app/schemas
      - name: Build debug and R8 release APKs and run Android lint (full path only)
        if: ${{ env.FULL_BUILD == 'true' }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintRelease
      - name: Summarize pending speech reviews
        run: |
          python3 - <<'PYREPORT'
          import csv, os
          from collections import Counter
          path = 'app/build/reports/speech-review.tsv'
          if not os.path.exists(path):
              print('Speech review report was not generated in this run.')
              raise SystemExit(0)
          with open(path, encoding='utf-8') as report:
              rows = list(csv.DictReader(report, delimiter='\t'))
          print(f'Speech review rows: {len(rows)}')
          for dialect in sorted({row['dialect'] for row in rows}):
              counts = Counter(row['source'] for row in rows if row['dialect'] == dialect)
              print(dialect, dict(counts))
          print('Native-speaker review and device TTS listening: PENDING for every row.')
          PYREPORT
      - name: Upload validation and speech review reports
        if: always()
        continue-on-error: true  # Storage quota must not invalidate tests.
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-validation-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/reports/speech-review.tsv
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test APK (full path only)
        if: ${{ env.FULL_BUILD == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned R8 Release APK for validation only (full path only)
        if: ${{ env.FULL_BUILD == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-unsigned-release-ci
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

