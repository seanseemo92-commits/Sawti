name: Publish the verified Sawti APK

on:
  push:
    branches: [fix/prelaunch-cleanup-hint]
    paths: [.github/workflows/publish-verified-release.yml, docs/greetings-design-1.2.md]

permissions:
  contents: write
  actions: read

concurrency:
  group: sawti-verified-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-verified]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '42903643167'
      SOURCE_COMMIT: 289eaa1c969a6b4e2250e55ac946a53af5a5f79e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4

      - name: Require successful full validation of unchanged application sources
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/validated-run.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'validated-run.json').read_text())
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_COMMIT']
          assert run['head_branch'] == 'fix/prelaunch-cleanup-hint'
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['SOURCE_COMMIT'], 'HEAD'], text=True).splitlines()
          assert set(paths) <= {'.github/workflows/publish-verified-release.yml', 'docs/greetings-design-1.2.md', 'README.md'}, paths
          print('Full validation succeeded; application, resources, tests and build inputs are unchanged.')
          PY

      - name: Retrieve the exact signed and checked APK
        run: |
          set -euo pipefail
          mkdir dist
          if ! gh run download "$SOURCE_RUN" --name Sawti-reviewed-signed-Release --dir dist; then
            gh release download "sawti-review-${SOURCE_RUN}-1" --dir dist
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import os
          from pathlib import Path
          expected = {'Sawti-v1.2-Release.apk', 'BUILD-INFO.txt', 'APK-SIGNATURE.txt', 'SHA256SUMS.txt', 'ABOUT-SCREENSHOTS.zip', 'GREETINGS-SCREENSHOTS.zip'}
          assert {p.name for p in Path('dist').iterdir()} == expected
          info = dict(line.split('=', 1) for line in Path('dist/BUILD-INFO.txt').read_text().splitlines())
          assert info['commit'] == os.environ['SOURCE_COMMIT']
          assert (info['versionName'], info['versionCode'], info['package']) == ('1.2', '3', 'com.sawti')
          assert (info['greetings_word_photos'], info['greetings_home_cover'], info['greetings_photo_dimensions']) == ('14', '1', '512x512')
          assert int(info['tests']) > 0 and int(info['failures']) == int(info['errors']) == 0
          print(Path('dist/BUILD-INFO.txt').read_text())
          PY
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/Sawti-v1.2-Release.apk > "$RUNNER_TEMP/rechecked-signature.txt"
          grep -q 'Verified using v2 scheme.*true' "$RUNNER_TEMP/rechecked-signature.txt"
          CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/rechecked-signature.txt" | sort -u)
          test "$CERT" = 754b679c29b0c8acf7c61ca265813d9528c0d0c3afe912b9319a6354cbd31b21
          "$BUILD_TOOLS/aapt" dump badging dist/Sawti-v1.2-Release.apk > "$RUNNER_TEMP/rechecked-badging.txt"
          python3 scripts/verify_release.py "$RUNNER_TEMP/rechecked-badging.txt"

      - name: Publish the same verified binary as a stable release
        if: contains(github.event.head_commit.message, '[publish-verified]')
        run: |
          set -euo pipefail
          gh release create v1.2 dist/* --target "$GITHUB_SHA" --latest \
            --title 'صوتي | Sawti v1.2' --notes-file docs/release-1.2.md
