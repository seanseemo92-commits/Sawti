name: Android 8-16 install and launch matrix

on:
  push:
    branches: [integration/android26-36-adaptive-20261113]
    paths:
      - .github/workflows/android-compatibility-check.yml
      - scripts/check_android_install.py
      - app/src/**
      - app/build.gradle.kts
      - build.gradle.kts
      - gradle/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [26, 28, 30, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build current-commit Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the newly built Sawti APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python3 scripts/check_android_install.py app/build/outputs/apk/debug/app-debug.apk --package com.sawti --activity com.sawti.MainActivity
