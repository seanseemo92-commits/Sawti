name: One-time Sawti identity rename validation
on:
  push:
    branches: [refactor/sawti-identity]
    paths:
      - .github/workflows/refactor-sawti-once.yml
permissions:
  contents: write
jobs:
  rename-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply one-time complete Android identity rename
        shell: bash
        run: python3 ci/rename_to_sawti_once.py
      - name: Verify new standalone Sawti app and tests
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/sawti/SawtiApp.kt
          test ! -d app/src/main/java/com/mywords
          test ! -d app/src/test/java/com/mywords
          grep -q 'applicationId = "com.sawti"' app/build.gradle.kts
          grep -q 'namespace = "com.sawti"' app/build.gradle.kts
          grep -q 'android:name=".SawtiApp"' app/src/main/AndroidManifest.xml
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintRelease
      - name: Commit tested rename on isolated branch (no workflow edits)
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: rename Android app, namespaces, files and resources to Sawti v4.3"
          git push origin HEAD:refactor/sawti-identity
