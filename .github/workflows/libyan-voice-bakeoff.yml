name: Libyan voice bakeoff ten Arabic voices (non-production)
on:
  push:
    branches: [fix/libyan-g-pronunciation-20261116]
    paths:
      - 'scripts/libyan_voice_bakeoff.py'
      - '.github/workflows/libyan-voice-bakeoff.yml'
  workflow_dispatch:
  pull_request:
    branches: [fix/audit-v161-199-confirmed-20261116]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [libya, egypt, iraq, tunisia, saudi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install edge-tts
        run: python -m pip install 'edge-tts>=6.1,<9'
      - name: Generate 19 hard-g and 9 control words across 10 voices
        run: python scripts/libyan_voice_bakeoff.py --group "${{ matrix.group }}"
      - name: Verify number of independent trial MP3s
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          base = Path('build/libyan-voice-bakeoff')
          mp3s = sorted(base.rglob('*.mp3'))
          with (base / 'INDEX.csv').open(encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          assert len(mp3s) == 56, len(mp3s)
          assert len(rows) == 56, len(rows)
          assert all(f.stat().st_size > 1024 for f in mp3s)
          assert len({r['voice_id'] for r in rows}) == 2
          print('All 56 voice comparison MP3s present; pronunciation accuracy still requires listening.')
          PY
      - name: Upload non-production voice comparison archive
        uses: actions/upload-artifact@v4
        with:
          name: sawti-libyan-voice-bakeoff-${{ matrix.group }}
          path: build/libyan-voice-bakeoff/
          retention-days: 14
          if-no-files-found: error
