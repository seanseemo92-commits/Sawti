name: Publish verified Sawti v4.4 release
on:
  push:
    branches: [release/sawti-v4-4-publish]
    paths: [.github/workflows/release-v44-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, check signing identity, and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release_v44_once.sh
