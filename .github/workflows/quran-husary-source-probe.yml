name: Quran teacher exact-audio alignment audit
on:
  push:
    branches: [feature/quran-full-recitation-cache-20261111]
    paths: [.github/workflows/quran-husary-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-sources:
    if: github.ref == 'refs/heads/feature/quran-full-recitation-cache-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Install waveform analysis tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg > /dev/null
          python3 -m pip install --quiet --break-system-packages numpy scipy
      - name: Check Husary original source against complete Baqarah ending
        run: python3 scripts/probe_husary_muallim_alignment.py
      - name: Save source identity report without media
        if: always()
        run: |
          test -s previews/quran-full-playback-test/HUSARY-ALIGNMENT-AUDIT.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/quran-full-playback-test/HUSARY-ALIGNMENT-AUDIT.json
          git diff --cached --quiet || (git commit -m "audit(quran): Husary teacher source identity results" && git push origin HEAD:feature/quran-full-recitation-cache-20261111)
