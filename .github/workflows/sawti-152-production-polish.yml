name: Sawti v1.5.2 production polish tests and lint
on:
  push:
    branches:
      - fix/sawti-152-production-polish-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawti-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper executable
        run: chmod +x gradlew
      - name: Check release baseline
        run: |
          python3 scripts/verify_release.py
          python3 scripts/verify_repository_baseline.py
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Verify Room v1 schema remains unchanged
        run: |
          test -s app/schemas/com.sawti.data.db.AppDatabase/1.json
          test "$(grep -c 'const val VERSION = 1' app/src/main/java/com/sawti/data/db/AppDatabase.kt)" -eq 1
          # Checkout fetches a shallow history; github.event.before may not
          # exist locally. Compare the tracked v1 schema to the verified
          # Git blob in main, then ensure Room/KSP generated no new changes.
          test "$(git rev-parse HEAD:app/schemas/com.sawti.data.db.AppDatabase/1.json)" = "8be852d8f8ac2f71b66a378791ea9fe9e1677e5f"
          git diff --exit-code HEAD -- app/schemas/
          test -z "$(git ls-files --others --exclude-standard -- app/schemas/)"
