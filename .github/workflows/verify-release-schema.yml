name: Verify Release Room schema serialization

on:
  push:
    branches: [fix/signed-release-room-schema-race]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Debug unit tests first (serialized KSP)
        run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest
      - name: Build unsigned Release APK AAB and run lint (serialized KSP)
        run: gradle --no-daemon --max-workers=1 :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Verify generated schema and release outputs
        run: |
          test -s app/schemas/com.sawti.data.db.AppDatabase/1.json
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
