name: Sawti signed release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release-signed.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: sawti-production-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read canonical release version
        run: python3 scripts/verify_release.py

      - name: Recover private release key (required, never commit it)
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.SAWTI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAWTI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAWTI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAWTI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sawti-release.jks"
          elif [[ -z "$KEYSTORE_BASE64" && -z "$STORE_PASSWORD" && -z "$KEY_ALIAS" && -z "$KEY_PASSWORD" ]]; then
            # Private publisher signing backup is downloaded only inside the trusted
            # main-branch runner. It is never committed to the repository.
            mkdir -p "$RUNNER_TEMP/sawti-private-key"
            gh run download 40346497322 --repo "$GITHUB_REPOSITORY" --name PRIVATE-MyWords-Publisher-Key-BACKUP --dir "$RUNNER_TEMP/sawti-private-key"

            test -s "$RUNNER_TEMP/sawti-private-key/mywords-publisher.p12"
            STORE_PASSWORD=$(sed -n 's/^Store and key password: //p' "$RUNNER_TEMP/sawti-private-key/KEEP_PRIVATE_SIGNING_INSTRUCTIONS.txt" | head -n 1 | tr -d '\r')
            test -n "$STORE_PASSWORD"

            echo "::add-mask::$STORE_PASSWORD"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=mywords-release
            cp "$RUNNER_TEMP/sawti-private-key/mywords-publisher.p12" "$RUNNER_TEMP/sawti-release.jks"
          else
            echo "::error::Signing secrets are only partially configured; refusing to guess a signing identity."
            exit 1
          fi

          test -s "$RUNNER_TEMP/sawti-release.jks"

          {
            echo "SAWTI_KEYSTORE_PATH=$RUNNER_TEMP/sawti-release.jks"
            echo "SAWTI_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "SAWTI_KEY_ALIAS=$KEY_ALIAS"
            echo "SAWTI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Build signed Release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest :app:lintRelease

      - name: Verify identity, version, publisher certificate and release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Release verification failed at line $LINENO"' ERR

          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/release-cert.txt"
          cat "$RUNNER_TEMP/release-cert.txt"
          grep -q 'Verified using v2 scheme.*true' "$RUNNER_TEMP/release-cert.txt"

          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 scripts/verify_release.py "$RUNNER_TEMP/apk-badging.txt"

          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-verification.txt"
          cat "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-verification.txt"

          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          cat "$RUNNER_TEMP/aab-cert.txt"

          APK_CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/release-cert.txt" | sort -u)
          AAB_CERT=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_CERT"
          test "$APK_CERT" = "$AAB_CERT"

          unzip -t "$AAB" > /dev/null

          mkdir -p dist
          cp "$APK" "dist/Sawti-v${RELEASE_VERSION}-Release.apk"
          cp "$AAB" "dist/Sawti-v${RELEASE_VERSION}-Release.aab"
          cp "$RUNNER_TEMP/release-cert.txt" dist/APK-SIGNATURE.txt

          printf 'commit=%s\nversionName=%s\nversionCode=%s\npackage=com.sawti\n' "$GITHUB_SHA" "$RELEASE_VERSION" "$RELEASE_CODE" > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-v${{ env.RELEASE_VERSION }}-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Never overwrite an existing version or attach files to a different commit.
          gh release create "v${RELEASE_VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "صوتي | Sawti v${RELEASE_VERSION}" \
            --notes "Initial public release of Sawti v${RELEASE_VERSION}.\n\n- versionName: ${RELEASE_VERSION}\n- versionCode: ${RELEASE_CODE}\n- Signed Release APK and Android App Bundle\n- SHA-256 checksums and build information included\n- No prior users, installed releases, or data migrations\n"

      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sawti-release.jks"
          rm -rf "$RUNNER_TEMP/sawti-private-key"
