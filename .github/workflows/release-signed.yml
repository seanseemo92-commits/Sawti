name: Sawti signed release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app/build.gradle.kts, .github/workflows/release-signed.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: sawti-production-release
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read canonical release version
        run: python3 scripts/verify_release.py
      - name: Verify bundled Quran assets before signing
        run: |
          set -euo pipefail
          python3 scripts/verify_quran_passages.py
          python3 scripts/verify_quran_surahs.py
      - name: Load publisher key from protected secrets (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.SAWTI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAWTI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAWTI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAWTI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Fail closed. Signing identity MUST come from protected secrets,
          # never from a workflow artifact or hard-coded password.
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Protected release signing secrets are missing or incomplete."
            exit 1
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sawti-release.jks"
          test -s "$RUNNER_TEMP/sawti-release.jks"
          {
            echo "SAWTI_KEYSTORE_PATH=$RUNNER_TEMP/sawti-release.jks"
            echo "SAWTI_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "SAWTI_KEY_ALIAS=$KEY_ALIAS"
            echo "SAWTI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
      - name: Build signed Release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Verify identity, version, publisher certificate and release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Release verification failed at line $LINENO"' ERR
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          unzip -t "$APK" > /dev/null
          unzip -Z1 "$APK" > "$RUNNER_TEMP/release-apk-files.txt"
          test "$(grep -Ec '^assets/quran_passages/(ar.alafasy|salah.bukhatir|husary.muallim)/2_(255|285|286)_[0-9]+\.mp3$' "$RUNNER_TEMP/release-apk-files.txt")" = 66
          test "$(grep -Ec '^assets/quran_surahs/(ar.alafasy|salah.bukhatir|husary.muallim)/[0-9]{6}\.mp3$' "$RUNNER_TEMP/release-apk-files.txt")" = 201
          test "$(grep -Ec '^assets/quran_surahs/text/surah_[0-9]+\.json$' "$RUNNER_TEMP/release-apk-files.txt")" = 13
          ! grep -Eq '^assets/quran_passages/.*/2_284_[0-9]+\.mp3$' "$RUNNER_TEMP/release-apk-files.txt"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new-cert.txt"
          cat "$RUNNER_TEMP/new-cert.txt"
          grep -q 'Verified using v2 scheme.*true' "$RUNNER_TEMP/new-cert.txt"
          # Historical v4.4 Release assets may be unavailable. Trust only the
          # previously pinned, verified publisher certificate SHA-256, fail closed.
          NEW_CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt" | sort -u)
          test "$NEW_CERT" = "754b679c29b0c8acf7c61ca265813d9528c0d0c3afe912b9319a6354cbd31b21"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 scripts/verify_release.py "$RUNNER_TEMP/apk-badging.txt"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/aab-verification.txt"
          cat "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/aab-verification.txt"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          cat "$RUNNER_TEMP/aab-cert.txt"
          AAB_CERT=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$AAB_CERT" = "$NEW_CERT"
          unzip -t "$AAB" > /dev/null
          mkdir -p dist
          cp "$APK" "dist/Sawti-v${RELEASE_VERSION}-Release.apk"
          cp "$AAB" "dist/Sawti-v${RELEASE_VERSION}-Release.aab"
          cp "$RUNNER_TEMP/new-cert.txt" dist/APK-SIGNATURE.txt
          printf 'commit=%s\nversionName=%s\nversionCode=%s\npackage=com.sawti\n' "$GITHUB_SHA" "$RELEASE_VERSION" "$RELEASE_CODE" > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Upload verified signed release
        continue-on-error: true  # Publishing the verified Release is the fallback when Actions storage is full.
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-v${{ env.RELEASE_VERSION }}-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite an existing version or attach files to a different commit.
          gh release create "v${RELEASE_VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "صوتي | Sawti v${RELEASE_VERSION}" --notes-file "docs/release-${RELEASE_VERSION}.md"
      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sawti-release.jks"

