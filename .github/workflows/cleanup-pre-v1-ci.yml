name: One-time cleanup of pre-v1.0 CI runs and artifacts

on:
  push:
    branches:
      - fix/prelaunch-cleanup-hint
    paths:
      - .github/workflows/cleanup-pre-v1-ci.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Remove pre-v1.0 historical test/build runs and their artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          # November 2, 2026: first signed v1.0 release run we must retain.
          CUTOFF = "2026-11-02T10:58:30Z"
          REPO = os.environ["GH_REPOSITORY"]
          API = "https://api.github.com/repos/" + REPO
          TOKEN = os.environ["GH_TOKEN"]
          PROTECTED_RELEASE = re.compile(
              r"signed release|publish verified|publish audited|release verification",
              re.IGNORECASE,
          )

          def request(method, endpoint):
              headers = {
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Sawti-pre-v1.0-artifact-cleanup",
              }
              for attempt in range(6):
                  try:
                      with urlopen(Request(API + endpoint, headers=headers, method=method), timeout=40) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else None
                  except HTTPError as exc:
                      if method == "DELETE" and exc.code == 404:
                          return None
                      if exc.code in (403, 429, 500, 502, 503, 504) and attempt < 5:
                          # Respect rate-limit responses and temporary GitHub API errors.
                          delay = min(60, 4 * (attempt + 1) ** 2)
                          print(f"HTTP {exc.code} during {method} {endpoint}; retrying in {delay}s", flush=True)
                          time.sleep(delay)
                          continue
                      raise
                  except (TimeoutError, URLError) as exc:
                      if attempt < 5:
                          time.sleep(min(30, 3 * (attempt + 1) ** 2))
                          continue
                      raise

          # Fetch a complete immutable list before deletion so page shifts cannot
          # cause skipped entries. Preserve v1.0+ and any signed release history.
          history = []
          page = 1
          while True:
              data = request("GET", f"/actions/runs?per_page=100&page={page}")
              chunk = data.get("workflow_runs", [])
              history.extend(chunk)
              if len(chunk) < 100:
                  break
              page += 1
              if page > 30:
                  raise RuntimeError("Unexpectedly many workflow run pages; refusing mass deletion")

          protected = [
              run for run in history
              if run["created_at"] >= CUTOFF or PROTECTED_RELEASE.search(run.get("name", ""))
          ]
          candidates = [
              run for run in history
              if run["created_at"] < CUTOFF
              and run.get("status") == "completed"
              and not PROTECTED_RELEASE.search(run.get("name", ""))
          ]
          print(
              f"Found {len(history)} total; {len(candidates)} pre-v1.0 completed CI runs "
              f"eligible for cleanup; protected={len(protected)}", flush=True
          )
          if len(candidates) > 600:
              raise RuntimeError("Safety limit exceeded; refusing to delete")

          deleted = 0
          errors = []
          for run in candidates:
              run_id = run["id"]
              try:
                  request("DELETE", f"/actions/runs/{run_id}")
                  deleted += 1
                  if deleted % 25 == 0:
                      print(f"Deleted {deleted}/{len(candidates)} old CI runs and their artifacts", flush=True)
                  time.sleep(0.28)
              except Exception as exc:
                  errors.append((run_id, str(exc)))
                  print(f"Delete failed: run={run_id}: {exc}", flush=True)
                  if len(errors) >= 8:
                      break

          summary = (
              f"Older CI runs deleted: {deleted}; "
              f"protected release/newer runs: {len(protected)}; "
              f"failures: {len(errors)}"
          )
          print(summary, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("## Sawti pre-1.0 cleanup\n\n" + summary + "\n")
          if errors:
              raise RuntimeError(f"Cleanup incomplete: {errors[:8]}")
          PY
