name: Deliver Quran three-reciter debug APK
on:
  push:
    branches:
      - fix/prelaunch-cleanup-hint
    paths:
      - .github/workflows/quran-apk-delivery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sawti-quran-apk-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == 'refs/heads/fix/prelaunch-cleanup-hint'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code on dev branch
        uses: actions/checkout@v4
        with:
          ref: fix/prelaunch-cleanup-hint
          fetch-depth: 1
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and validate APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Try GitHub Actions artifact
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-Quran-Reciters-Bukhatir-Husary-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Fallback - commit APK to the dev branch for direct download
        if: steps.artifact.outcome != 'success'
        run: |
          set -euo pipefail
          mkdir -p previews
          cp app/build/outputs/apk/debug/app-debug.apk previews/Sawti-Quran-Reciters-Bukhatir-Husary-debug.apk
          (cd previews && sha256sum Sawti-Quran-Reciters-Bukhatir-Husary-debug.apk > Sawti-Quran-Reciters-Bukhatir-Husary-debug.apk.sha256)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add previews/Sawti-Quran-Reciters-Bukhatir-Husary-debug.apk previews/Sawti-Quran-Reciters-Bukhatir-Husary-debug.apk.sha256
          git commit -m "build(preview): expose verified three-reciter Quran APK for testing"
          git push origin HEAD:fix/prelaunch-cleanup-hint
