name: Sawti preview - greetings removed from question exercise APK

on:
  push:
    branches: [feature/quran-full-recitation-cache-20261111]
    paths:
      - .github/workflows/quran-full-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quran-whole-recitation-preview
  cancel-in-progress: true

jobs:
  build-preview:
    if: github.ref == 'refs/heads/feature/quran-full-recitation-cache-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch, not main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build isolated Quran test APK, tests and lint
        run: |
          gradle --no-daemon -PquranPreview=true :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          git diff --exit-code -- app/schemas
      - name: Verify package identity and no whole-recitation assets added to APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" > dist/APK-METADATA.txt
          grep -q "package: name='com.sawti.quranpreview'" dist/APK-METADATA.txt
          unzip -Z1 "$APK" > dist/APK-CONTENTS.txt
          if grep -q '^assets/quran_full_recitations/' dist/APK-CONTENTS.txt; then
            echo "Unexpected whole-surah audio bundled in app"; exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > dist/APK-SIGNATURE.txt
          cp "$APK" dist/Sawti-Quran-Full-Playback-TEST.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload APK for user testing
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-Quran-Full-Playback-TEST
          path: |
            dist/*
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 7
      - name: Artifact quota fallback - commit test APK only on feature branch
        if: steps.artifact.outcome != 'success'
        run: |
          set -euo pipefail
          mkdir -p previews/quran-full-playback-test
          cp dist/Sawti-Quran-Full-Playback-TEST.apk dist/SHA256SUMS.txt dist/APK-METADATA.txt previews/quran-full-playback-test/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never publish an APK built from stale app source code.
          # Retry benign non-fast-forward races caused by artifact-only pushes.
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/quran-full-recitation-cache-20261111
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- app/ build.gradle.kts settings.gradle.kts gradle/; then
              echo "::error::Application source changed during this build. Generate a new APK from the latest commit."
              exit 1
            fi
            git reset --mixed FETCH_HEAD
            git add previews/quran-full-playback-test/
            if git diff --cached --quiet; then
              echo "Current preview APK and metadata already match."
              exit 0
            fi
            git commit -m 'build(preview): deliver greetings-free question practice and Quran fixes APK'
            if git push origin HEAD:feature/quran-full-recitation-cache-20261111; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Could not publish test APK after push retries."
          exit 1
