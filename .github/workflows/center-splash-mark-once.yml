name: One-time visual centering of Sawti wordmark PNGs
on:
  push:
    branches:
      - fix/center-splash-wordmarks-20261028

jobs:
  center:
    if: "github.event.head_commit.message == 'chore(splash): center original transparent wordmark content'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Center the visible pixels without resampling or cropping artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = [
              ("app/src/main/res/drawable/sawti_splash_mark_light.png",
               "app/src/main/res/drawable-nodpi/sawti_wordmark_centered_light.png"),
              ("app/src/main/res/drawable/sawti_splash_mark_dark.png",
               "app/src/main/res/drawable-nodpi/sawti_wordmark_centered_dark.png"),
          ]
          for source, target in assets:
              im = Image.open(source).convert("RGBA")
              assert im.size == (410, 430), (source, im.size)
              mask = im.getchannel("A").point(lambda x: 255 if x > 8 else 0)
              bbox = mask.getbbox()
              assert bbox is not None, source
              left, top, right, bottom = bbox
              dx = round(im.width / 2 - (left + right) / 2)
              dy = round(im.height / 2 - (top + bottom) / 2)
              assert left + dx >= 0 and right + dx <= im.width
              assert top + dy >= 0 and bottom + dy <= im.height
              out = Image.new("RGBA", im.size, (0, 0, 0, 0))
              out.paste(im, (dx, dy))
              assert sorted(out.getchannel("A").getdata()) == sorted(im.getchannel("A").getdata())
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              out.save(target)
              print(f"Centered {source}: bounds={bbox} offset=({dx},{dy}) => {target}")
          PY
      - name: Commit and push centered source-faithful PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/sawti_wordmark_centered_light.png app/src/main/res/drawable-nodpi/sawti_wordmark_centered_dark.png
          git diff --cached --quiet && { echo "Expected centered PNG changes"; exit 1; }
          git commit -m "fix(splash): preserve artwork while centering visible logo pixels"
          git push origin HEAD:fix/center-splash-wordmarks-20261028
