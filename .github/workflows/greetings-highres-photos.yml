name: Install high-resolution greetings photography

on:
  push:
    branches:
      - fix/prelaunch-cleanup-hint
    paths:
      - docs/greetings-highres.trigger

permissions:
  contents: write

concurrency:
  group: sawti-greetings-photo-assets
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download and normalize each licensed source photo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps, ImageEnhance, ImageFilter
          from urllib.request import urlopen, Request
          import time

          # Pexels source photo IDs: verified free-use source pages in the manifest.
          # Each concept has its own full-resolution WebP, not an upscaled 4x4 atlas.
          photo_ids = {
              "salam": 19285888,          # senior gentleman waves
              "reply": 6281877,          # hijab-wearing woman greets
              "hello": 8993937,          # woman in hijab waving hello
              "welcome": 8640136,        # hijab-wearing women together
              "how_are_you": 8121961,    # two women conversing
              "fine": 7249248,           # hijab-wearing woman hand to chest
              "good_morning": 694636,    # actual golden sunrise
              "good_evening": 5674510,   # mosque in evening light
              "brighten": 7249295,       # three women smiling together
              "good_health": 37097128,   # elderly smiling man
              "goodbye": 11826780,       # senior gentleman waves farewell
              "safe": 32091741,          # friends walking together in hijab
              "thanks": 6084250,         # cheerful hijab-wearing woman
              "bless": 8422437,          # hands raised in prayer
              "cover": 28977571,         # warm traditional handshake
          }
          dest = Path("app/src/main/res/drawable-nodpi")
          dest.mkdir(parents=True, exist_ok=True)
          square = (816, 960)   # ratio 0.85, identical to the shared Sawti cards
          for key, image_id in photo_ids.items():
              url = (f"https://images.pexels.com/photos/{image_id}/"
                     f"pexels-photo-{image_id}.jpeg?auto=compress&cs=tinysrgb&w=1800")
              error = None
              for attempt in range(3):
                  try:
                      req = Request(url, headers={"User-Agent": "Sawti-Asset-Builder/1.0"})
                      with urlopen(req, timeout=45) as response:
                          data = response.read(12 * 1024 * 1024)
                          if not response.headers.get("Content-Type", "").startswith("image/"):
                              raise RuntimeError(f"Unexpected content type for {key}")
                      image = Image.open(BytesIO(data))
                      image.load()
                      if image.width < 816 or image.height < 960:
                          raise RuntimeError(f"Source too small for {key}: {image.size}")
                      break
                  except Exception as exc:
                      error = exc
                      if attempt == 2: raise RuntimeError(f"Photo download failed ({key})") from exc
                      time.sleep(2 * (attempt + 1))

              rgb = ImageOps.exif_transpose(image).convert("RGB")
              if key == "cover":
                  # Keep both people's handshake even when the source is landscape:
                  # blurred full-bleed edges avoid stretching faces or chopping arms.
                  background = ImageOps.fit(rgb, square, method=Image.Resampling.LANCZOS)
                  background = background.filter(ImageFilter.GaussianBlur(14))
                  contained = ImageOps.contain(rgb, square, method=Image.Resampling.LANCZOS)
                  x = (square[0] - contained.width) // 2
                  y = (square[1] - contained.height) // 2
                  background.paste(contained, (x, y))
                  fitted = background
              else:
                  focal = (0.5, 0.39) if key not in ("good_morning", "good_evening") else (0.5, 0.5)
                  fitted = ImageOps.fit(rgb, square, method=Image.Resampling.LANCZOS, centering=focal)
              fitted = ImageEnhance.Color(fitted).enhance(0.98)
              fitted = ImageEnhance.Contrast(fitted).enhance(1.03)
              target = (dest / f"greeting_{key}.webp") if key != "cover" else Path("app/src/main/res/drawable/img_cat_greetings.webp")
              target.parent.mkdir(parents=True, exist_ok=True)
              fitted.save(target, "WEBP", quality=88, method=6)
              size = target.stat().st_size
              if size < 18_000:
                  raise RuntimeError(f"Unexpectedly small WebP ({key}): {size}")
              print(f"{key}: {fitted.width}x{fitted.height} ({size:,} bytes)")

          lines = [
              "# Greetings photography sources",
              "",
              "These originals are published as free-use Pexels photos. Source pages are retained for license provenance.",
              "All images are cropped and resized offline; the app never downloads them.",
              "No face/speech pairing is linked to a user's dialect, ethnicity or location.",
              "",
              "| Concept | Source page |",
              "|---|---|",
          ]
          for key, image_id in photo_ids.items():
              lines.append(f"| greeting.{key} | https://www.pexels.com/photo/{image_id}/ |")
          Path("docs/GREETINGS_PHOTO_SOURCES.md").write_text("\n".join(lines) + "\n", encoding="utf8")
          PY
      - name: Verify 15 photos are complete and consistent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("app/src/main/res/drawable-nodpi")
          files = sorted(root.glob("greeting_*.webp"))
          assert len(files) == 14, f"Expected 14 greetings, got {len(files)}"
          files += [Path("app/src/main/res/drawable/img_cat_greetings.webp")]
          for file in files:
              with Image.open(file) as im:
                  assert im.size == (816, 960), (str(file), im.size)
                  assert im.format == "WEBP"
          print("All 14 greeting cards and the main cover are 816x960 WebP.")
          PY
      - name: Commit generated offline images to the feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/greeting_*.webp app/src/main/res/drawable/img_cat_greetings.webp docs/GREETINGS_PHOTO_SOURCES.md
          if git diff --cached --quiet; then
            echo "Identical images already committed."
          else
            git commit -m "feat(greetings): package high-resolution inclusive photos [skip ci]"
            git push origin HEAD:fix/prelaunch-cleanup-hint
          fi
