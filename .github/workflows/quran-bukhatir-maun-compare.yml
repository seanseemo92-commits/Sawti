name: Compare Salah Bukhatir Al-Maun source SHA256
on:
  push:
    branches: [fix/prelaunch-cleanup-hint]
    paths: [.github/workflows/quran-bukhatir-maun-compare.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify both repositories provide the identical files for all seven verses
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/maun
          for n in 1 2 3 4 5 6 7; do
            printf '\n=== AL-MAUN VERSE %s ===\n' "$n"
            file=$(printf '107%03d.mp3' "$n")
            primary="/tmp/maun/primary-${file}"
            mirror="/tmp/maun/mirror-${file}"
            u1="https://everyayah.com/data/Salaah_AbdulRahman_Bukhatir_128kbps/${file}"
            u2="https://huggingface.co/datasets/maqra-project/salah-bukhatir-128kbps/resolve/main/${file}"
            st1=$(curl -L -sS --connect-timeout 8 --max-time 25 -w '%{http_code}' -o "$primary" "$u1") || st1=FAILED
            st2=$(curl -L -sS --connect-timeout 8 --max-time 25 -w '%{http_code}' -o "$mirror" "$u2") || st2=FAILED
            size1=$(wc -c < "$primary" 2>/dev/null || echo 0)
            size2=$(wc -c < "$mirror" 2>/dev/null || echo 0)
            sha1=$(sha256sum "$primary" 2>/dev/null | cut -d' ' -f1)
            sha2=$(sha256sum "$mirror" 2>/dev/null | cut -d' ' -f1)
            echo "PRIMARY_HTTP=$st1 BYTES=$size1 SHA256=$sha1"
            echo "MIRROR_HTTP=$st2 BYTES=$size2 SHA256=$sha2"
            if [ "$st1" = 200 ] && [ "$st2" = 200 ] && [ "$sha1" = "$sha2" ]; then
              echo "RESULT=BYTE_IDENTICAL"
            else
              echo "RESULT=DIFFERENT_OR_FETCH_FAILED"
            fi
            file "$primary" "$mirror" || true
          done
