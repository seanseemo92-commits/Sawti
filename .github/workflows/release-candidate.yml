name: Sawti final APK validation and signing

on:
  push:
    branches: [feature/quran-full-recitation-cache-20261111]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sawti-final-apk
  cancel-in-progress: false

jobs:
  verified-apk:
    if: >-
      github.ref == 'refs/heads/feature/quran-full-recitation-cache-20261111' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deliver-rc]'))
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check version, source integrity and current repository baseline
        run: |
          python3 scripts/verify_release.py
          python3 scripts/verify_repository_baseline.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify protected publisher key before spending time on compilation
        env:
          KEYSTORE_BASE64: ${{ secrets.SAWTI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAWTI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAWTI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAWTI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Protected release signing secrets are missing or incomplete."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sawti-final.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/sawti-final.jks" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > "$RUNNER_TEMP/publisher-cert.txt"
          CERT=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/publisher-cert.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "754b679c29b0c8acf7c61ca265813d9528c0d0c3afe912b9319a6354cbd31b21"
          {
            echo "SAWTI_KEYSTORE_PATH=$RUNNER_TEMP/sawti-final.jks"
            echo "SAWTI_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "SAWTI_KEY_ALIAS=$KEY_ALIAS"
            echo "SAWTI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify every bundled Quran file and decode its audio
        run: |
          set -euo pipefail
          python3 scripts/verify_quran_passages.py --decode
          python3 scripts/verify_quran_surahs.py --decode
      - name: Run all unit tests, Release Lint and the signed R8 build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Check database schema stability, package and original publisher signature
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/schemas
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p dist
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > dist/APK-SIGNATURE.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK-SIGNATURE.txt
          CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' dist/APK-SIGNATURE.txt | sort -u)
          test "$CERT" = "754b679c29b0c8acf7c61ca265813d9528c0d0c3afe912b9319a6354cbd31b21"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 scripts/verify_release.py "$RUNNER_TEMP/apk-badging.txt"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          python3 scripts/verify_packaged_quran.py "$APK"
          cp "$APK" "dist/Sawti-v${RELEASE_VERSION}-Release.apk"
          printf 'commit=%s\nversionName=%s\nversionCode=%s\npackage=com.sawti\n' \
            "$GITHUB_SHA" "$RELEASE_VERSION" "$RELEASE_CODE" > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Summarize the completed tests
        if: always()
        run: python3 scripts/summarize_final_checks.py
      - name: Deliver the same signed APK for final device verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="sawti-v${RELEASE_VERSION}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "صوتي ${RELEASE_VERSION} — مرشح الإصدار النهائي" \
            --notes-file docs/final-apk-verification-1.5.md
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-final-validation-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sawti-final.jks"
