name: Diagnose Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-build.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug-tests
            tasks: ':app:testDebugUnitTest'
          - variant: release
            tasks: ':app:assembleRelease :app:bundleRelease :app:lintRelease'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Diagnose ${{ matrix.variant }}
        env:
          BUILD_TASKS: ${{ matrix.tasks }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          gradle --no-daemon --console=plain --stacktrace $BUILD_TASKS 2>&1 | tee diagnostics/build.log
          status=${PIPESTATUS[0]}
          {
            echo '## Build diagnosis: ${{ matrix.variant }}'
            echo "Exit code: $status"
            echo '```text'
            grep -n -E -A 8 '(^e:|^error:|Caused by:|What went wrong|Execution failed|OutOfMemoryError|Exception)' diagnostics/build.log | head -c 24000 || true
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            diagnostics/
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn
