name: Generate cleaned splash vectors once
on:
  push:
    branches:
      - fix/splash-clean-vector-20261029
permissions:
  contents: write
jobs:
  generate:
    if: "github.event.head_commit.message == 'chore(splash): build cleaned vector resources'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contour tracing dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Generate both mode-specific Android VectorDrawables
        run: python tools/generate_clean_splash_vectors.py
      - name: Verify both outputs and commit
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable/sawti_wordmark_vector_light.xml
          test -s app/src/main/res/drawable/sawti_wordmark_vector_dark.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/sawti_wordmark_vector_light.xml app/src/main/res/drawable/sawti_wordmark_vector_dark.xml
          git diff --cached --quiet && { echo "::error::No vector resources generated"; exit 1; }
          git commit -m "fix(splash): add clean scalable Arabic logo vector resources"
          git fetch origin fix/splash-clean-vector-20261029
          git rebase FETCH_HEAD
          git push origin HEAD:fix/splash-clean-vector-20261029
