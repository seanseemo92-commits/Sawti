name: Inspect native design audit measurements
on:
  push:
    branches: [fix/prelaunch-cleanup-hint]
    paths: [.github/workflows/design-audit.yml, app/src/test/java/com/sawti/presentation/DesignAuditLayoutTest.kt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[inspect-layout]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise native layout measurements
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests com.sawti.presentation.DesignAuditLayoutTest
      - name: Export measured native evidence even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          directory = Path('app/build/outputs/design-audit-after')
          records = [json.loads(p.read_text()) for p in sorted(directory.glob('*.json'))]
          print('SAWTI_LAYOUT_DIAGNOSTICS ' + base64.b64encode(gzip.compress(json.dumps(records, ensure_ascii=False).encode(), mtime=0)).decode())
          for name in ('home-light-normal', 'home-light-large', 'sentence-light-large', 'tour-dark-large'):
              path = directory / (name + '.png')
              if path.exists(): print('SAWTI_LAYOUT_IMAGE ' + name + ' ' + base64.b64encode(path.read_bytes()).decode())
          PY
