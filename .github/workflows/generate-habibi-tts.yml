name: Generate Habibi-TTS voice packs

on:
  workflow_dispatch:
    inputs:
      dialect:
        description: 'Generate ALL or one Sawti dialect'
        required: true
        default: LIBYAN
        type: choice
        options:
          - LIBYAN
          - TUNISIAN
          - ALGERIAN
          - MOROCCAN
          - EGYPTIAN
          - SYRIAN
          - IRAQI
          - SAUDI
          - STANDARD
          - ALL
      max_new:
        description: 'Maximum newly synthesized clips PER dialect this run; 0 = all'
        required: true
        type: number
        default: 16
      skip_existing:
        description: 'Reuse ONLY matching Habibi v2 clips by text/hash/model/reference'
        required: true
        type: boolean
        default: true
      device:
        description: 'GitHub-hosted runners have CPU only'
        required: true
        type: choice
        default: cpu
        options: [cpu]
      ack_noncommercial:
        description: 'I confirm this run has authorization for Habibi Unified CC-BY-NC-SA-4.0'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sawti-habibi-voice-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.ref == 'refs/heads/migration/habibi-tts-20261116' && inputs.ack_noncommercial }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg, CPU PyTorch, Habibi-TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install habibi-tts soundfile pydub
      - name: Export exact unvowelized Kotlin speech corpus
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.sawti.domain.model.ExportSpeechCatalogTest'
          test -s app/build/speech_catalog.json
      - name: Validate generator contracts
        run: python -m unittest discover -s scripts -p 'test_habibi_contract.py'
      - name: Synthesize a resumable Habibi batch
        env:
          DIALECT: ${{ inputs.dialect }}
          DEVICE: ${{ inputs.device }}
          MAX_NEW: ${{ inputs.max_new }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$SKIP_EXISTING" = "true" ]; then FLAGS+=(--skip-existing); fi
          python scripts/generate_habibi_tts.py \
            --dialect "$DIALECT" \
            --device "$DEVICE" \
            --max-new "$MAX_NEW" \
            --ack-noncommercial "${FLAGS[@]}"
      - name: Save generated Habibi MP3s and manifest in this branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/neural_tts/
          if git diff --cached --quiet; then
            echo 'All requested Habibi recordings were already verified.'
            exit 0
          fi
          git commit -m "feat(habibi): generate ${{ inputs.dialect }} offline voice batch"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Snapshot generated manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habibi-manifests-${{ inputs.dialect }}-${{ github.run_id }}
          path: app/src/main/assets/neural_tts/**/manifest.json
          if-no-files-found: warn
          retention-days: 7
