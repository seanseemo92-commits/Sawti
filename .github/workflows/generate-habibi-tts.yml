name: Generate Habibi-TTS voice packs

on:
  workflow_dispatch:
    inputs:
      dialect:
        description: Generate ALL or one Sawti dialect
        required: true
        default: LIBYAN
        type: choice
        options: [ALL, LIBYAN, TUNISIAN, ALGERIAN, MOROCCAN, EGYPTIAN, SYRIAN, IRAQI, SAUDI, STANDARD]
      max_new:
        description: 'Maximum new clips per dialect this run; 0 = all (time budget still applies)'
        required: true
        type: number
        default: 16
      skip_existing:
        description: Reuse only verified Habibi clips with matching text, settings and reference
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sawti-habibi-voice-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    # Write only to the branch explicitly selected by workflow_dispatch.
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-habibi.txt
      - name: Cache downloaded model and vocoder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/cached_path
          key: habibi-unified-v1-${{ runner.os }}-${{ hashFiles('scripts/requirements-habibi.txt') }}
      - name: Install CPU inference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-habibi.txt
          python -m pip check
      - name: Export and test the exact clean Kotlin speech corpus
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.sawti.domain.model.ExportSpeechCatalogTest' --tests 'com.sawti.domain.model.HabibiSpeechTextTest'
          python -m unittest discover -s scripts -p 'test_habibi*.py'
      - name: Synthesize resumable CPU batch
        id: synthesize
        timeout-minutes: 305
        env:
          DIALECT: ${{ inputs.dialect }}
          MAX_NEW: ${{ inputs.max_new }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$SKIP_EXISTING" = 'true' ]; then FLAGS+=(--skip-existing); fi
          python scripts/generate_habibi_tts.py --dialect "$DIALECT" --device cpu \
            --max-new "$MAX_NEW" --max-seconds 17400 "${FLAGS[@]}"
      - name: Verify and save completed clips, including after an interrupted batch
        if: ${{ always() && steps.synthesize.outcome != 'skipped' }}
        env:
          DIALECT: ${{ inputs.dialect }}
        run: |
          set -euo pipefail
          if [ ! -d app/src/main/assets/neural_tts ]; then exit 0; fi
          python scripts/verify_habibi_packs.py --dialect "$DIALECT" --allow-partial --verify-codec
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PYADD'
          import json, subprocess
          from pathlib import Path
          for manifest in Path('app/src/main/assets/neural_tts').glob('*/manifest.json'):
              entries = json.loads(manifest.read_text())['entries']
              paths = [str(manifest), *(str(manifest.parent / row['file']) for row in entries.values())]
              subprocess.run(['git', 'add', '--', *paths], check=True)
          PYADD
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(habibi): generate $DIALECT offline voice batch"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve generated clips if repository push is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habibi-${{ inputs.dialect }}-${{ github.run_id }}
          path: app/src/main/assets/neural_tts/
          if-no-files-found: warn
          retention-days: 7
