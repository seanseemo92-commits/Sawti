name: Export actual Sawti speech audit corpus

on:
  push:
    branches: [fix/prelaunch-cleanup-hint]
    paths: [.github/workflows/speech-audit.yml]

permissions:
  contents: read

jobs:
  corpus:
    if: contains(github.event.head_commit.message, '[inspect-speech]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Export all built-in concepts through the production dialect resolver
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests com.sawti.domain.model.SpeechReviewCoverageTest
      - name: Export compressed review data without personal user content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          content = Path('app/build/reports/speech-review.tsv').read_bytes()
          rows = content.decode('utf-8').splitlines()
          assert len(rows) == 2400
          print('SAWTI_SPEECH_CORPUS ' + base64.b64encode(gzip.compress(content, mtime=0)).decode('ascii'))
          print('speech_rows=' + str(len(rows) - 1))
          PY
