name: Validate current source audit baseline
on:
  push:
    branches: [fix/prelaunch-cleanup-hint]
    paths: [.github/workflows/build.yml, .github/workflows/repository-audit.yml, scripts/verify_repository_baseline.py]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Export the actual current Room schema
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:kspDebugKotlin
          python3 - <<'PYSCHEMA'
          import base64, gzip
          from pathlib import Path
          data = Path('app/schemas/com.sawti.data.db.AppDatabase/1.json').read_bytes()
          print('SAWTI_ROOM_SCHEMA ' + base64.b64encode(gzip.compress(data, mtime=0)).decode('ascii'))
          PYSCHEMA
      - name: Verify canonical version and current foundation
        run: |
          python3 scripts/verify_release.py
          python3 scripts/verify_repository_baseline.py
          git ls-files --error-unmatch app/schemas/com.sawti.data.db.AppDatabase/1.json
          git diff --exit-code -- app/schemas
