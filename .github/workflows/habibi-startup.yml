name: Validate and deliver Habibi startup fix
on:
  push:
    branches: [migration/habibi-tts-20261116]
    paths:
      - .github/workflows/habibi-startup.yml
      - app/src/main/java/com/sawti/domain/model/HabibiSpeechText.kt
      - app/src/androidTest/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source, database and the complete audio pack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 scripts/verify_repository_baseline.py
          python3 scripts/verify_release.py
          chmod +x gradlew
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest
          python3 scripts/verify_habibi_packs.py --verify-codec
          git diff --exit-code -- app/schemas
      - name: Build isolated preview and on-device regression tests
        run: |
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process -PhabibiPreview=true :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          test "$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Ec '^assets/neural_tts/.+[.]mp3$')" = 2399
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sawti-Habibi-Startup-Fixed.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/startup-tests.apk
          cd dist
          sha256sum Sawti-Habibi-Startup-Fixed.apk > Sawti-Habibi-Startup-Fixed.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: startup-build-${{ github.run_id }}
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-unit-lint-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/lint-results-debug.*
  launch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: startup-build-${{ github.run_id }}
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify startup and regressions on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p diagnostics
            adb install dist/Sawti-Habibi-Startup-Fixed.apk
            adb install dist/startup-tests.apk
            adb logcat -c || true
            adb shell am instrument -w -r -e class com.sawti.HabibiStartupTest,com.sawti.SawtiIntegrationTest com.sawti.habibipreview.test/androidx.test.runner.AndroidJUnitRunner > diagnostics/instrumentation.txt
            cat diagnostics/instrumentation.txt
            grep -q '^OK (' diagnostics/instrumentation.txt
            adb shell am force-stop com.sawti.habibipreview
            adb shell am start -W -n com.sawti.habibipreview/com.sawti.MainActivity > diagnostics/launch.txt
            sleep 15
            adb logcat -d > diagnostics/logcat.txt
            adb exec-out screencap -p > diagnostics/screen.png
            cat diagnostics/launch.txt
            adb shell pidof com.sawti.habibipreview
            if grep -q 'FATAL EXCEPTION' diagnostics/logcat.txt; then sed -n '/FATAL EXCEPTION/,+65p' diagnostics/logcat.txt; exit 1; fi
      - name: Capture diagnostics even after a failed launch
        if: always()
        run: |
          mkdir -p diagnostics
          adb logcat -d > diagnostics/logcat-final.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-startup-api-${{ matrix.api }}-${{ github.run_id }}
          path: diagnostics/
  deliver:
    needs: [build, launch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: startup-build-${{ github.run_id }}
          path: dist
      - name: Keep verified APK as a draft for testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "habibi-startup-fixed-$GITHUB_RUN_ID" --draft --prerelease --target "$GITHUB_SHA" --title 'Sawti Habibi startup fix — tested on Android 8 and 13' --notes 'All 2399 audio clips preserved. Full unit suite, lint and Android 26/33 instrumentation plus launcher smoke checks passed. Test package com.sawti.habibipreview. Uninstall the earlier broken preview before installing if Android reports a signature conflict. Main remains unmerged. Native-speaker listening review remains pending.' dist/Sawti-Habibi-Startup-Fixed.apk dist/Sawti-Habibi-Startup-Fixed.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Sawti-Habibi-Startup-Fixed-Verified-${{ github.run_id }}
          path: |
            dist/Sawti-Habibi-Startup-Fixed.apk
            dist/Sawti-Habibi-Startup-Fixed.apk.sha256
