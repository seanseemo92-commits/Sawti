name: Quran Al-Fatiha audio cue inspection
on:
  push:
    branches: [feature/quran-full-recitation-cache-20261111]
    paths: [.github/workflows/quran-fatiha-source-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-fatiha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact MP3Quran Fatiha source timing in milliseconds
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          for reader in (123,46):
              url=f"https://www.mp3quran.net/api/v3/ayat_timing?surah=1&read={reader}"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Sawti-Quran-Audit/1.4"}),timeout=20) as r:
                  rows=json.load(r)
              print("READ",reader,"ROW_COUNT",len(rows))
              print("RAW_TIMES",json.dumps(rows[:7],ensure_ascii=False))
          PY
