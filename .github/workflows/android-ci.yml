name: Android build verification

on:
  push:
    branches: [main, improve/android-stability-arabic]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract archived Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f MyWords.zip
          unzip -q MyWords.zip -d extracted
          test -f extracted/MyWords/settings.gradle.kts
      - name: Compile and run unit tests
        working-directory: extracted/MyWords
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
