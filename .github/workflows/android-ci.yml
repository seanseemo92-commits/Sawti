name: Android build verification

on:
  push:
    branches: [main, improve/android-stability-arabic]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK availability
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Repair legacy migration inside ZIP and commit on branch push
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, os
          archive = "MyWords.zip"
          tmp = archive + ".tmp"
          with zipfile.ZipFile(archive) as src, zipfile.ZipFile(tmp, "w") as dst:
              for info in src.infolist():
                  data = src.read(info.filename)
                  if info.filename.endswith("/data/db/AppDatabase.kt"):
                      code = data.decode("utf-8")
                      for table in ("family_members", "voice_recordings", "pain_reports"):
                          code = code.replace('db.execSQL("DROP TABLE IF EXISTS ' + table + '")', '// Legacy table retained: ' + table)
                      data = code.encode("utf-8")
                  dst.writestr(info, data)
          os.replace(tmp, archive)
          PY
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/improve/android-stability-arabic" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MyWords.zip
            if ! git diff --cached --quiet; then
              git commit -m "fix: retain legacy tables during Room migration"
              git push origin HEAD:improve/android-stability-arabic
            fi
          fi
      - name: Extract archived Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f MyWords.zip
          unzip -q MyWords.zip -d extracted
          test -f extracted/MyWords/settings.gradle.kts
      - name: Apply hardened backup and recovery sources
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci/secure-backup-sources.tar.gz.b64 | tar -xz -C extracted/MyWords/app/src/main/java/com/mywords
          test -f extracted/MyWords/app/src/main/java/com/mywords/data/BackupManager.kt
          grep -q 'recoverIfInterrupted(this)' extracted/MyWords/app/src/main/java/com/mywords/MyWordsApp.kt
          grep -q 'PRAGMA integrity_check' extracted/MyWords/app/src/main/java/com/mywords/data/BackupManager.kt
      - name: Patch empty-file backup export and verify file integrity
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/mywords-backup-export-fix.patch.xz.b64 | xz --decompress | patch -p1 -d extracted/MyWords
          grep -q 'VACUUM INTO' extracted/MyWords/app/src/main/java/com/mywords/data/BackupManager.kt
          grep -q 'zip.getInputStream' extracted/MyWords/app/src/main/java/com/mywords/data/BackupManager.kt
          grep -q 'فشل إنشاء النسخة الاحتياطية' extracted/MyWords/app/src/main/java/com/mywords/presentation/settings/SettingsScreen.kt
      - name: Show explicit restore success confirmation
        shell: bash
        run: python3 ci/restore_success_ux.py
      - name: Apply Sawti dialect and regional speech settings
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/sawti-source-overlay.tar.gz.b64 | tar --extract --gzip --directory extracted
          sed -i 's/versionName = "3.2"/versionName = "4.0"/' extracted/MyWords/app/build.gradle.kts
          grep -q 'rootProject.name = "Sawti"' extracted/MyWords/settings.gradle.kts
          grep -q 'name="app_name">صوتي<' extracted/MyWords/app/src/main/res/values/strings.xml
          grep -q 'com.mywords' extracted/MyWords/app/build.gradle.kts
          test -f extracted/MyWords/app/src/test/java/com/mywords/domain/model/DialectCatalogTest.kt
      - name: Install JUnit dependency for added speech tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("extracted/MyWords/app/build.gradle.kts")
          s=p.read_text()
          if 'testImplementation("junit:junit:4.13.2")' not in s:
              s += '\\n' if not s.endswith('\\n') else ''
              s += '\\ndependencies { testImplementation("junit:junit:4.13.2") }\\n'
              s=s.replace('\\n', '\n')
              p.write_text(s)
          PY
      - name: Include Arabic speech unit tests
        shell: bash
        run: |
          mkdir -p extracted/MyWords/app/src/test/java/com/mywords/domain/model
          cp tests/android/PhonemicCueArabicTest.kt extracted/MyWords/app/src/test/java/com/mywords/domain/model/
      - name: Check archive data safety contracts
        id: safety
        continue-on-error: true
        run: python3 -m unittest discover -s tests -v
      - name: Compile and run unit tests
        working-directory: extracted/MyWords
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Configure stable release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.MYWORDS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MYWORDS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MYWORDS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are not configured; skipping release build."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > extracted/MyWords/app/mywords-release.jks
          cat >> extracted/MyWords/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("ciRelease") {
                      storeFile = file("mywords-release.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = "mywords"
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("ciRelease")
                  }
              }
              defaultConfig {
                  versionCode = 10000 + (System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1)
              }
          }
          EOF
          (cd extracted/MyWords && gradle --no-daemon :app:assembleRelease)
      - name: Verify release signing output
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -n "${{ secrets.MYWORDS_KEYSTORE_BASE64 }}" ]]; then
            test -s extracted/MyWords/app/build/outputs/apk/release/app-release.apk
            echo "Signed release APK produced; versionCode follows workflow run number."
          fi
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MyWords-release-apk
          path: extracted/MyWords/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyWords-debug-apk
          path: extracted/MyWords/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Package Sawti project safely
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp -a extracted/MyWords package/Sawti
          rm -rf package/Sawti/.gradle package/Sawti/build package/Sawti/app/build
          rm -f package/Sawti/app/mywords-release.jks package/Sawti/local.properties
          if find package/Sawti -iname '*.jks' -o -iname '*.keystore' | grep -q .; then
            echo "Signing file found in package. Refusing to publish source."
            exit 1
          fi
          (cd package && zip -qr ../Sawti-source.zip Sawti)
      - name: Upload Sawti project sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-source-project
          path: Sawti-source.zip
          retention-days: 14
      - name: Enforce data safety
        if: always()
        env:
          SAFETY_RESULT: ${{ steps.safety.outcome }}
        run: test "$SAFETY_RESULT" = success
