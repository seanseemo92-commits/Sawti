name: Sawti reviewed signed Release APK

on:
  push:
    branches: [fix/prelaunch-cleanup-hint]
  workflow_dispatch:

permissions:
  contents: write # Private pre-release fallback only if artifact quota is exhausted.
  actions: read

concurrency:
  group: sawti-reviewed-apk
  # A newer audit supersedes an obsolete audit run; regular deliveries retain the queue.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[audit-baseline]') }}

jobs:
  reviewed-release:
    if: >-
      github.ref == 'refs/heads/fix/prelaunch-cleanup-hint' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deliver-apk]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical version
        run: python3 scripts/verify_release.py

      - name: Test APK resource-table verification
        run: python3 scripts/test_review_apk_resources.py

      - name: Verify prior completed checks for a packaging-only retry
        if: contains(github.event.head_commit.message, '[package-retry]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/129786303130" > "$RUNNER_TEMP/prior-review-job.json"
          python3 - <<'PY'
          import json, os, subprocess
          base = 'ee321de61457b659bcbaa9ef2b2c2b60e8d52afc'
          job = json.load(open(os.environ['RUNNER_TEMP'] + '/prior-review-job.json'))
          assert job['run_id'] == 42803380026
          assert job['head_sha'] == base
          checks = {step['name']: step['conclusion'] for step in job['steps']}
          assert checks['Build debug and run complete tests and lint'] == 'success'
          assert checks['Build signed optimized Release and lint'] == 'success'
          allowed = {'.github/workflows/signed-review-apk.yml', 'scripts/summarize_review_build.py',
                     'scripts/review_apk_resources.py', 'scripts/test_review_apk_resources.py'}
          changes = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          assert changes and changes <= allowed, 'App/test/build inputs changed: full validation required'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VALIDATION_COMMIT={base}\nVALIDATION_RUN_ID=42803380026\n')
          print('Prior complete tests and both Lint variants verified; only packaging verification changed.')
          PY

      - name: Capture the published baseline before checking corrected layouts
        if: contains(github.event.head_commit.message, '[audit-baseline]')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sawti-fixed-ui"
          paths=(app/src/main/java/com/sawti/presentation/home/HomeScreen.kt app/src/main/java/com/sawti/presentation/practice/PracticeScreen.kt app/src/main/java/com/sawti/presentation/common/SentenceStrip.kt app/src/main/java/com/sawti/presentation/navigation/AppRoot.kt app/src/main/java/com/sawti/presentation/onboarding/SpotlightTour.kt)
          restore_ui() {
            for path in "${paths[@]}"; do cp "$RUNNER_TEMP/sawti-fixed-ui/$(basename "$path")" "$path"; done
          }
          for path in "${paths[@]}"; do cp "$path" "$RUNNER_TEMP/sawti-fixed-ui/$(basename "$path")"; done
          trap restore_ui EXIT
          for path in "${paths[@]}"; do git show "4694c3f7c463bb181f3171e3380c1bd844d6c62e:$path" > "$path"; done
          # Only expose the unchanged private banner body to the isolated UI test.
          sed -i 's/private fun CaregiverBanner/internal fun CaregiverBanner/' app/src/main/java/com/sawti/presentation/navigation/AppRoot.kt
          chmod +x gradlew
          SAWTI_AUDIT_BASELINE=1 ./gradlew --no-daemon :app:testDebugUnitTest --tests com.sawti.presentation.DesignAuditLayoutTest

      - name: Build debug and run complete tests and lint
        if: ${{ !contains(github.event.head_commit.message, '[package-retry]') }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --continue

      - name: Show first test failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')):
              failures = ET.parse(report).getroot().findall('.//failure')
              if failures:
                  print(report.name)
                  print(failures[0].attrib.get('message', ''))
                  print((failures[0].text or '')[:10000])
                  break
          PY

      - name: Load existing publisher identity privately
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.SAWTI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAWTI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAWTI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAWTI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sawti-review.jks"
          elif [[ -z "$KEYSTORE_BASE64" && -z "$STORE_PASSWORD" && -z "$KEY_ALIAS" && -z "$KEY_PASSWORD" ]]; then
            # Existing restricted publisher backup, recovered only inside this trusted branch runner.
            mkdir -p "$RUNNER_TEMP/sawti-review-key"
            gh run download 40346497322 --repo "$GITHUB_REPOSITORY" --name PRIVATE-MyWords-Publisher-Key-BACKUP --dir "$RUNNER_TEMP/sawti-review-key"
            test -s "$RUNNER_TEMP/sawti-review-key/mywords-publisher.p12"
            STORE_PASSWORD=$(sed -n 's/^Store and key password: //p' "$RUNNER_TEMP/sawti-review-key/KEEP_PRIVATE_SIGNING_INSTRUCTIONS.txt" | head -n 1 | tr -d '\r')
            test -n "$STORE_PASSWORD"
            echo "::add-mask::$STORE_PASSWORD"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=mywords-release
            cp "$RUNNER_TEMP/sawti-review-key/mywords-publisher.p12" "$RUNNER_TEMP/sawti-review.jks"
          else
            echo "::error::Signing secrets are partially configured."
            exit 1
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          test -s "$RUNNER_TEMP/sawti-review.jks"
          {
            echo "SAWTI_KEYSTORE_PATH=$RUNNER_TEMP/sawti-review.jks"
            echo "SAWTI_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "SAWTI_KEY_ALIAS=$KEY_ALIAS"
            echo "SAWTI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed optimized Release and lint
        run: |
          chmod +x gradlew
          if [[ -n "${VALIDATION_RUN_ID:-}" ]]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            ./gradlew --no-daemon :app:assembleRelease :app:lintRelease --continue
          fi

      - name: Verify signature and package, then prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p dist
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > dist/APK-SIGNATURE.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK-SIGNATURE.txt
          CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' dist/APK-SIGNATURE.txt | sort -u)
          test "$CERT" = "754b679c29b0c8acf7c61ca265813d9528c0d0c3afe912b9319a6354cbd31b21"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/review-badging.txt"
          python3 scripts/verify_release.py "$RUNNER_TEMP/review-badging.txt"
          unzip -t "$APK" > /dev/null
          cp "$APK" "dist/Sawti-v${RELEASE_VERSION}-Release.apk"
          "$BUILD_TOOLS/aapt2" dump resources "$APK" > "$RUNNER_TEMP/review-resources.txt"
          python3 scripts/review_speech_corpus.py
          if [[ -d app/build/outputs/design-audit-before ]]; then python3 scripts/package_design_audit.py; fi
          python3 scripts/summarize_review_build.py "$RUNNER_TEMP/review-resources.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          if [[ -d app/build/outputs/about-review ]]; then
            (cd app/build/outputs && zip -q -r ../../../dist/ABOUT-SCREENSHOTS.zip about-review)
          fi
          (cd app/build/outputs && zip -q -r ../../../dist/GREETINGS-SCREENSHOTS.zip greetings-review)
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for screenshot in sorted(Path('app/build/outputs/greetings-review').glob('*.png')):
              content = screenshot.read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) < 2_000_000
              print('SAWTI_GREETING_SCREENSHOT ' + screenshot.stem + ' ' + base64.b64encode(content).decode('ascii'))
          for name in ('about-light', 'about-dark', 'about-large-text'):
              content = Path('app/build/outputs/about-review', name + '.png').read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) < 2_000_000
              print('SAWTI_ABOUT_SCREENSHOT ' + name + ' ' + base64.b64encode(content).decode('ascii'))
          PY

      - name: Upload reviewed signed APK
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Sawti-reviewed-signed-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Deliver private pre-release when artifact quota is unavailable
        if: steps.artifact.outcome != 'success' && !contains(github.event.head_commit.message, '[publish-release]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "sawti-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" dist/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "صوتي - نسخة Release للمراجعة" \
            --notes "نسخة مراجعة موقّعة من فرع العمل، بعد اختبارات الوحدة وLint وفحص توقيع الناشر. لا دمج مع main ولا تغيير للإصدار الرسمي. تفاصيل الالتزام والاختبارات والبصمة مرفقة."

      - name: Publish verified production release
        if: contains(github.event.head_commit.message, '[publish-release]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Full checks and exact publisher verification above must pass first.
          gh release create "v${RELEASE_VERSION}" dist/* \
            --target "$GITHUB_SHA" --latest \
            --title "صوتي | Sawti v${RELEASE_VERSION}" \
            --notes-file "docs/release-${RELEASE_VERSION}.md"

      - name: Remove private signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sawti-review.jks"
          rm -rf "$RUNNER_TEMP/sawti-review-key"

